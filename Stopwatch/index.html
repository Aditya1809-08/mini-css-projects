<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">jhj
<title>Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1: #0b1638;
    --bg-2: #0f2a5e;
    --bg-3: #071026;

    --ink: #e8542c;
    --ink-strong: #d1451f;
    --muted: #b56a4a;

    --pill-idle-bg: #ffffff;
    --pill-idle-text: #b8531f;
    --pill-active-bg: #ff7a3d;
    --pill-active-text: #ffffff;
    --pill-shadow: rgba(150,70,20,0.18);

    --tile-bg-top: #ffab5c;
    --tile-bg-mid: #ff7a3d;
    --tile-bg-bottom: #ee5a34;
    --tile-text: #ffffff;
    --tile-shadow: rgba(150,50,10,0.4);
    --tile-hinge: rgba(0,0,0,0.28);
    --tile-dot: rgba(255,255,255,0.6);

    --stop-bg: #ffffff;
    --stop-text: #e8542c;
    --stop-shadow: rgba(150,50,10,0.28);

    --pause-bg: rgba(255,255,255,0.2);
    --pause-text: #ffffff;
    --pause-border: rgba(255,255,255,0.4);

    --label-text: rgba(255,255,255,0.9);
    --hint-text: rgba(255,255,255,0.8);
  }

  *{ box-sizing: border-box; }
  html, body{ height: 100%; margin: 0; overflow-x: hidden; }

  body{
    font-family: 'Inter', -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(24px, 4vw, 36px);
    padding: max(28px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: radial-gradient(circle at 82% 8%, #17306b 0%, transparent 40%), linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
    background-image: var(--bg-url, none), radial-gradient(circle at 82% 8%, #17306b 0%, transparent 40%), linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
    background-size: cover, auto, auto;
    background-position: center, center, center;
    background-repeat: no-repeat;
    position: relative;
  }

  /* ---------- Decorative space elements (behind the content) ---------- */
  .stars-layer{
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  .stars-layer .stars-a, .stars-layer .stars-b{
    position: absolute;
    top: 0; left: 0;
    width: 1px; height: 1px;
    border-radius: 50%;
    background: transparent;
  }
  .stars-layer .stars-a{ box-shadow: 663px 970px 0 #fff, 308px 404px 0 #fff, 1333px 49px 0 #fff, 148px 840px 0 #fff, 1097px 96px 0 #fff, 748px 596px 0 #fff, 118px 931px 0 #fff, 1039px 219px 0 #fff, 76px 88px 0 #fff, 888px 428px 0 #fff, 143px 246px 0 #fff, 185px 564px 0 #fff, 869px 60px 0 #fff, 1158px 126px 0 #fff, 457px 645px 0 #fff, 1284px 596px 0 #fff, 126px 590px 0 #fff, 1199px 406px 0 #fff, 101px 999px 0 #fff, 452px 47px 0 #fff, 1140px 879px 0 #fff, 272px 296px 0 #fff, 858px 147px 0 #fff, 1107px 120px 0 #fff, 1169px 315px 0 #fff, 1147px 835px 0 #fff, 1396px 185px 0 #fff, 211px 595px 0 #fff, 1169px 654px 0 #fff, 384px 381px 0 #fff, 199px 560px 0 #fff, 1458px 64px 0 #fff, 1155px 61px 0 #fff, 1267px 210px 0 #fff, 1016px 696px 0 #fff, 1088px 437px 0 #fff, 1591px 321px 0 #fff, 953px 599px 0 #fff, 928px 370px 0 #fff, 613px 254px 0 #fff, 368px 715px 0 #fff, 1597px 249px 0 #fff, 167px 588px 0 #fff, 614px 537px 0 #fff, 1013px 896px 0 #fff, 703px 746px 0 #fff, 919px 294px 0 #fff, 1247px 74px 0 #fff, 241px 524px 0 #fff, 856px 168px 0 #fff, 1550px 350px 0 #fff, 311px 955px 0 #fff, 1001px 431px 0 #fff, 80px 985px 0 #fff, 1368px 79px 0 #fff, 1565px 571px 0 #fff, 1173px 808px 0 #fff, 642px 348px 0 #fff, 1423px 358px 0 #fff, 1217px 508px 0 #fff, 1187px 816px 0 #fff, 934px 70px 0 #fff, 191px 967px 0 #fff, 552px 485px 0 #fff, 1427px 680px 0 #fff, 133px 62px 0 #fff, 1497px 718px 0 #fff, 634px 662px 0 #fff, 1183px 697px 0 #fff, 912px 291px 0 #fff, 1467px 395px 0 #fff, 1369px 355px 0 #fff, 46px 963px 0 #fff, 945px 363px 0 #fff, 344px 625px 0 #fff, 239px 505px 0 #fff, 120px 223px 0 #fff, 1573px 294px 0 #fff, 264px 756px 0 #fff, 507px 407px 0 #fff, 800px 938px 0 #fff, 1016px 82px 0 #fff, 340px 459px 0 #fff, 822px 562px 0 #fff, 569px 904px 0 #fff, 280px 838px 0 #fff, 881px 884px 0 #fff, 1126px 285px 0 #fff, 1446px 425px 0 #fff, 734px 699px 0 #fff; animation: twinkle 3.4s ease-in-out infinite; }
  .stars-layer .stars-b{ box-shadow: 779px 980px 0 2px #fff, 472px 154px 0 2px #fff, 169px 180px 0 2px #fff, 309px 237px 0 2px #fff, 1348px 238px 0 2px #fff, 24px 496px 0 2px #fff, 1206px 186px 0 2px #fff, 538px 288px 0 2px #fff, 8px 149px 0 2px #fff, 858px 547px 0 2px #fff, 756px 624px 0 2px #fff, 1159px 326px 0 2px #fff, 257px 707px 0 2px #fff, 1055px 973px 0 2px #fff, 1264px 670px 0 2px #fff, 1384px 757px 0 2px #fff, 110px 467px 0 2px #fff, 1393px 817px 0 2px #fff, 1145px 401px 0 2px #fff, 815px 408px 0 2px #fff, 807px 106px 0 2px #fff, 986px 649px 0 2px #fff, 820px 63px 0 2px #fff, 390px 68px 0 2px #fff, 427px 451px 0 2px #fff, 332px 112px 0 2px #fff, 696px 615px 0 2px #fff, 107px 104px 0 2px #fff, 309px 549px 0 2px #fff, 207px 971px 0 2px #fff, 744px 628px 0 2px #fff, 52px 72px 0 2px #fff, 425px 628px 0 2px #fff, 770px 152px 0 2px #fff, 1299px 258px 0 2px #fff, 711px 616px 0 2px #fff, 745px 485px 0 2px #fff, 251px 118px 0 2px #fff, 999px 477px 0 2px #fff, 983px 495px 0 2px #fff, 638px 87px 0 2px #fff, 295px 104px 0 2px #fff, 1535px 350px 0 2px #fff, 1516px 271px 0 2px #fff, 980px 848px 0 2px #fff, 1417px 165px 0 2px #fff, 1057px 23px 0 2px #fff, 420px 973px 0 2px #fff; animation: twinkle 4.6s ease-in-out infinite 1.2s; }
  @keyframes twinkle{
    0%, 100%{ opacity: 0.9; }
    50%{ opacity: 0.35; }
  }

  .moon-decor{
    position: fixed;
    top: -70px; right: -70px;
    width: 220px; height: 220px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 32%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 8%),
      radial-gradient(circle at 62% 55%, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 10%),
      radial-gradient(circle at 45% 45%, #fdf3d3 0%, #f3d99a 55%, #e2b768 100%);
    box-shadow: 0 0 70px 20px rgba(243,217,154,0.35);
    z-index: 0;
    pointer-events: none;
    animation: glowPulse 7s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%, 100%{ box-shadow: 0 0 70px 20px rgba(243,217,154,0.3); }
    50%{ box-shadow: 0 0 90px 26px rgba(243,217,154,0.45); }
  }

  .planet-decor{
    position: fixed;
    bottom: -60px; left: -60px;
    width: 190px; height: 190px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #7fe3d0 0%, #2f9e9c 55%, #146a72 100%);
    box-shadow: 0 0 60px 18px rgba(63,208,201,0.28);
    z-index: 0;
    pointer-events: none;
  }

  .ufo-decor{
    position: fixed;
    width: 74px; height: auto;
    z-index: 0;
    pointer-events: none;
    animation: driftSide 22s ease-in-out infinite;
  }
  .ufo-decor.ufo-1{ top: 20%; left: 8%; }
  .ufo-decor.ufo-2{ top: 10%; left: 58%; width: 56px; animation-duration: 26s; animation-delay: 2s; }
  @keyframes driftSide{
    0%, 100%{ transform: translateX(0) translateY(0); }
    50%{ transform: translateX(14px) translateY(-8px); }
  }

  .rocket-decor{
    position: fixed;
    top: 12%; right: 14%;
    width: 70px; height: auto;
    z-index: 0;
    pointer-events: none;
    animation: rocketBob 5s ease-in-out infinite;
  }
  @keyframes rocketBob{
    0%, 100%{ transform: translateY(0) rotate(28deg); }
    50%{ transform: translateY(-10px) rotate(28deg); }
  }

  .astronaut-decor{
    position: fixed;
    bottom: 6%; left: 6%;
    width: 90px; height: auto;
    z-index: 0;
    pointer-events: none;
    animation: astronautFloat 8s ease-in-out infinite;
  }
  @keyframes astronautFloat{
    0%, 100%{ transform: translateY(0) rotate(-4deg); }
    50%{ transform: translateY(-14px) rotate(4deg); }
  }

  /* keep real content above the decorations */
  .presets, .clock-wrap, .home-indicator, .hint{
    position: relative;
    z-index: 1;
  }

  .fullscreen-btn{
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    right: max(16px, env(safe-area-inset-right));
    width: 42px; height: 42px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(6px);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 2;
    transition: background 0.2s ease, transform 0.1s ease;
  }
  .fullscreen-btn:hover{ background: rgba(255,255,255,0.3); }
  .fullscreen-btn:active{ transform: scale(0.94); }
  .fullscreen-btn svg{ width: 20px; height: 20px; }

  @media (max-width: 560px){
    .moon-decor{ width: 160px; height: 160px; top: -50px; right: -50px; }
    .planet-decor{ width: 130px; height: 130px; bottom: -40px; left: -40px; }
    .astronaut-decor, .rocket-decor{ width: 58px; }
    .ufo-decor{ width: 48px; }
  }

  @media (max-height: 560px){
    .ufo-decor, .astronaut-decor, .rocket-decor, .planet-decor{ display: none; }
  }

  @media (prefers-reduced-motion: reduce){
    .stars-layer .stars-a, .stars-layer .stars-b, .moon-decor, .ufo-decor, .rocket-decor, .astronaut-decor{ animation: none; }
  }

  /* ---------- Preset pills (unchanged) ---------- */
  .presets{
    display: flex;
    gap: clamp(8px, 2vw, 10px);
    flex-wrap: wrap;
    justify-content: center;
    padding: 0 4px;
  }

  .pill{
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: clamp(13.5px, 3.4vw, 15px);
    font-weight: 600;
    padding: 12px clamp(14px, 4vw, 20px);
    border-radius: 16px;
    background: var(--pill-idle-bg);
    color: var(--pill-idle-text);
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    line-height: 1;
    box-shadow: 0 6px 16px var(--pill-shadow);
    transition: background 0.2s ease, color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
  }
  .pill:hover{ transform: translateY(-1px); box-shadow: 0 8px 20px var(--pill-shadow); }
  .pill:active{ transform: translateY(0) scale(0.97); }
  .pill.active{
    background: var(--pill-active-bg);
    color: var(--pill-active-text);
    box-shadow: 0 8px 20px rgba(230,100,40,0.4);
  }

  .pill.custom-pill{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 12px 16px;
  }
  .pill.custom-pill input{
    background: transparent;
    border: none;
    outline: none;
    color: inherit;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    line-height: 1;
    text-align: center;
    padding: 0;
  }
  .pill.custom-pill input#customMinInput{ width: 3.2ch; }
  .pill.custom-pill input#customSecInput{ width: 2.2ch; }
  .pill.custom-pill input::placeholder{ color: inherit; opacity: 0.55; }
  .pill.custom-pill span.unit{ font-size: 13px; opacity: 0.75; }
  .pill.custom-pill span.sep{ font-size: 14px; opacity: 0.4; margin: 0 1px; }

  /* ---------- Flip clock ---------- */
  .clock-wrap{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(16px, 3.5vw, 22px);
    width: min(94vw, 480px);
  }

  .clock-label{
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--label-text);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .status-dot{
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  .status-dot.live{
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.25);
    animation: pulseDot 1.6s ease-in-out infinite;
  }
  @keyframes pulseDot{
    0%, 100%{ box-shadow: 0 0 0 3px rgba(255,255,255,0.22); }
    50%{ box-shadow: 0 0 0 6px rgba(255,255,255,0.08); }
  }

  .flip-clock{
    display: flex;
    justify-content: center;
    gap: clamp(10px, 3vw, 20px);
  }

  .flip-unit{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .flip-caption{
    font-size: clamp(10.5px, 2.6vw, 12.5px);
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--label-text);
  }

  /* ----- tile: two static halves + two animated flap leaves ----- */
  .flip-tile{
    position: relative;
    width: clamp(56px, 18vw, 84px);
    aspect-ratio: 1 / 1;
    border-radius: clamp(10px, 2.4vw, 14px);
    box-shadow: 0 14px 26px var(--tile-shadow);
    overflow: hidden;
    perspective: 240px;
  }

  .flip-half-box{
    position: absolute;
    left: 0; right: 0;
    height: 50%;
    overflow: hidden;
    z-index: 1;
  }
  .flip-half-box.pos-top{ top: 0; background: linear-gradient(180deg, var(--tile-bg-top), var(--tile-bg-mid)); }
  .flip-half-box.pos-bottom{ bottom: 0; background: linear-gradient(180deg, var(--tile-bg-mid), var(--tile-bg-bottom)); }

  .digit-inner{
    position: absolute;
    left: 0; right: 0;
    height: 200%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    font-weight: 700;
    font-size: clamp(26px, 8vw, 40px);
    color: var(--tile-text);
    line-height: 1;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
  }
  .pos-top .digit-inner{ top: 0; }
  .pos-bottom .digit-inner{ top: -100%; }
  .digit-inner.long{ font-size: clamp(15px, 4.2vw, 22px); }

  .flip-leaf{
    position: absolute;
    left: 0; right: 0;
    height: 50%;
    overflow: hidden;
    backface-visibility: hidden;
    z-index: 3;
    box-shadow: inset 0 -6px 10px rgba(0,0,0,0.08);
  }
  .flip-leaf.pos-top{
    top: 0;
    transform-origin: bottom center;
    background: linear-gradient(180deg, var(--tile-bg-top), var(--tile-bg-mid));
    transform: rotateX(0deg);
  }
  .flip-leaf.pos-bottom{
    bottom: 0;
    transform-origin: top center;
    background: linear-gradient(180deg, var(--tile-bg-mid), var(--tile-bg-bottom));
    transform: rotateX(0deg);
  }

  .flip-tile::before{
    /* diagonal sheen, echoes the reference tiles */
    content: "";
    position: absolute;
    inset: -20%;
    background: linear-gradient(115deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0) 34%);
    pointer-events: none;
    z-index: 4;
  }
  .flip-tile::after{
    /* center hinge line, always on top so it reads through the flip */
    content: "";
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 2px;
    background: var(--tile-hinge);
    transform: translateY(-1px);
    box-shadow: 0 1px 0 rgba(255,255,255,0.06);
    z-index: 5;
  }

  .hinge-dot{
    position: absolute;
    top: 50%;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--tile-dot);
    transform: translateY(-50%);
    z-index: 6;
  }
  .hinge-dot.left{ left: 6px; }
  .hinge-dot.right{ right: 6px; }

  .btn-row{
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 320px;
  }

  .stop-btn, .pause-btn{
    flex: 1 1 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: inherit;
    border: 1px solid transparent;
    padding: 12px 16px;
    border-radius: 15px;
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
  }
  .stop-btn{ background: var(--stop-bg); color: var(--stop-text); box-shadow: 0 10px 22px var(--stop-shadow); }
  .stop-btn:hover:not(:disabled){ filter: brightness(0.98); }
  .pause-btn{ background: var(--pause-bg); color: var(--pause-text); border-color: var(--pause-border); backdrop-filter: blur(6px); }
  .pause-btn:hover:not(:disabled){ background: rgba(255,255,255,0.24); }
  .stop-btn:active:not(:disabled), .pause-btn:active:not(:disabled){ transform: scale(0.96); }
  .stop-btn:disabled, .pause-btn:disabled{ opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .stop-btn svg, .pause-btn svg{ width: 14px; height: 14px; flex-shrink: 0; }

  .home-indicator{
    width: 130px;
    height: 5px;
    border-radius: 999px;
    background: rgba(255,255,255,0.5);
  }

  .hint{
    color: var(--hint-text);
    font-size: 13px;
    font-weight: 500;
    text-align: center;
    max-width: 380px;
    padding: 0 12px;
  }

  /* ---------- Small phones: tighten tile spacing ---------- */
  @media (max-width: 380px){
    .flip-clock{ gap: 8px; }
    .flip-tile{ width: clamp(50px, 20vw, 70px); }
  }

  /* ---------- Short / landscape viewports ---------- */
  @media (max-height: 560px){
    body{ justify-content: flex-start; gap: 16px; padding-top: max(18px, env(safe-area-inset-top)); padding-bottom: max(18px, env(safe-area-inset-bottom)); }
    .flip-tile{ width: clamp(44px, 10vw, 60px); }
    .digit-inner{ font-size: clamp(20px, 5vw, 28px); }
    .home-indicator{ display: none; }
    .hint{ display: none; }
  }

  @media (prefers-reduced-motion: reduce){
    .pill, .stop-btn, .pause-btn, .status-dot, .flip-leaf{ transition: none; animation: none; }
  }
</style>
</head>

  <svg class="astronaut-decor" aria-hidden="true" viewBox="0 0 100 120">
    <ellipse cx="50" cy="98" rx="30" ry="8" fill="#0b1638" opacity="0.25"/>
    <circle cx="50" cy="38" r="26" fill="#eef2f8"/>
    <circle cx="50" cy="40" r="18" fill="#16254a"/>
    <circle cx="55" cy="35" r="5" fill="#3a5aa8" opacity="0.6"/>
    <rect x="28" y="58" width="44" height="38" rx="16" fill="#eef2f8"/>
    <rect x="14" y="62" width="16" height="22" rx="8" fill="#eef2f8"/>
    <rect x="70" y="62" width="16" height="22" rx="8" fill="#eef2f8"/>
    <rect x="34" y="92" width="14" height="20" rx="7" fill="#eef2f8"/>
    <rect x="52" y="92" width="14" height="20" rx="7" fill="#eef2f8"/>
    <circle cx="50" cy="76" r="6" fill="#ff7a3d"/>
  </svg>

  <div class="presets" id="presets">
    <button class="pill" data-mins="5">5 mins</button>
    <button class="pill" data-mins="10">10 mins</button>
    <button class="pill" data-mins="20">20 mins</button>
    <label class="pill custom-pill" id="customPill">
      <input id="customMinInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="00">
      <span class="unit">m</span>
      <span class="sep">:</span>
      <input id="customSecInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="00">
      <span class="unit">s</span>
    </label>
  </div>

  <div class="clock-wrap">
    <div class="clock-label"><span class="status-dot" id="statusDot"></span>Timer</div>

    <div class="flip-clock" id="flipClock"></div>

    <div class="btn-row">
      <button class="pause-btn" id="pauseBtn" disabled>
        <svg viewBox="0 0 24 24" fill="none"><path id="pauseBtnIconPath" d="M8 5v14l11-7z" fill="currentColor"/></svg>
        <span id="pauseBtnLabel">Pause</span>
      </button>
      <button class="stop-btn" id="stopBtn" disabled>
        <svg viewBox="0 0 24 24" fill="none"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
        Stop
      </button>
    </div>
  </div>

  <div class="home-indicator"></div>

  <div class="hint">Pick a preset or set a custom minutes and seconds to start the timer.</div>

<script>
(function(){

  /* =========================================================
     BACKGROUND IMAGE — DEV-ONLY SETTING.
     There is no on-page control for this on purpose: only
     someone editing this file's code can change it. Just
     replace the URL string below and reload the page.
  ========================================================= */
  const BACKGROUND_IMAGE_URL = ""; // e.g. "https://images.unsplash.com/photo-XXXX"

  const body = document.body;

  function setBackground(url){
    if (url){
      body.style.setProperty('--bg-url', `url("${url}")`);
    } else {
      body.style.setProperty('--bg-url', 'none');
    }
  }

  setBackground(BACKGROUND_IMAGE_URL);

  /* =========================================================
     FULLSCREEN TOGGLE
  ========================================================= */
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const fullscreenIcon = document.getElementById('fullscreenIcon');
  const ENTER_ICON = '<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>';
  const EXIT_ICON = '<path d="M4 8V5a2 2 0 0 1 2-2h3M20 8V5a2 2 0 0 0-2-2h-3M4 16v3a2 2 0 0 0 2 2h3M20 16v3a2 2 0 0 1-2 2h-3"/>';

  function isFullscreen(){
    return !!document.fullscreenElement;
  }

  function updateFullscreenIcon(){
    fullscreenIcon.innerHTML = isFullscreen() ? EXIT_ICON : ENTER_ICON;
  }

  fullscreenBtn.addEventListener('click', () => {
    if (!isFullscreen()){
      document.documentElement.requestFullscreen?.().catch(() => {});
    } else {
      document.exitFullscreen?.().catch(() => {});
    }
  });

  document.addEventListener('fullscreenchange', updateFullscreenIcon);
  updateFullscreenIcon();

  // Hide the button entirely if the browser has no Fullscreen API support
  if (!document.documentElement.requestFullscreen){
    fullscreenBtn.style.display = 'none';
  }

  /* =========================================================
     FLIP TILES — build the 4 units (Days/Hours/Minutes/Seconds)
     Each tile = 2 static halves (always show the current value)
     + 2 animated "leaf" halves that flip to reveal a new value,
     mimicking a real mechanical split-flap display.
  ========================================================= */
  const UNITS = [
    { key: 'days', label: 'Days' },
    { key: 'hours', label: 'Hours' },
    { key: 'minutes', label: 'Minutes' },
    { key: 'seconds', label: 'Seconds' },
  ];

  const flipClockEl = document.getElementById('flipClock');
  const tiles = {};

  UNITS.forEach(({ key, label }) => {
    const unit = document.createElement('div');
    unit.className = 'flip-unit';
    unit.innerHTML = `
      <div class="flip-tile" data-key="${key}">
        <div class="flip-half-box pos-top"><div class="digit-inner" data-role="static-top">00</div></div>
        <div class="flip-half-box pos-bottom"><div class="digit-inner" data-role="static-bottom">00</div></div>
        <div class="flip-leaf pos-top" data-role="leaf-top"><div class="digit-inner" data-role="leaf-top-text">00</div></div>
        <div class="flip-leaf pos-bottom" data-role="leaf-bottom"><div class="digit-inner" data-role="leaf-bottom-text">00</div></div>
        <span class="hinge-dot left"></span><span class="hinge-dot right"></span>
      </div>
      <div class="flip-caption">${label}</div>
    `;
    flipClockEl.appendChild(unit);

    const tileEl = unit.querySelector('.flip-tile');
    const staticTop = tileEl.querySelector('[data-role="static-top"]');
    const staticBottom = tileEl.querySelector('[data-role="static-bottom"]');
    const leafTopText = tileEl.querySelector('[data-role="leaf-top-text"]');
    const leafBottomText = tileEl.querySelector('[data-role="leaf-bottom-text"]');
    tiles[key] = {
      value: null,
      staticTop, staticBottom,
      leafTop: tileEl.querySelector('[data-role="leaf-top"]'),
      leafTopText,
      leafBottom: tileEl.querySelector('[data-role="leaf-bottom"]'),
      leafBottomText,
      allTextEls: [staticTop, staticBottom, leafTopText, leafBottomText],
      timers: [],
    };
  });

  const FLIP_MS = 300; // duration of each half-flip phase

  function setLongClass(key, value){
    const t = tiles[key];
    const isLong = value.length > 2;
    t.allTextEls.forEach(el => el.classList.toggle('long', isLong));
  }

  function setTileInstant(key, value){
    const t = tiles[key];
    t.timers.forEach(id => clearTimeout(id));
    t.timers = [];
    setLongClass(key, value);
    t.staticTop.textContent = value;
    t.staticBottom.textContent = value;
    t.leafTopText.textContent = value;
    t.leafBottomText.textContent = value;
    t.leafTop.style.transition = 'none';
    t.leafTop.style.transform = 'rotateX(0deg)';
    t.leafBottom.style.transition = 'none';
    t.leafBottom.style.transform = 'rotateX(0deg)';
    t.value = value;
  }

  function flipTileTo(key, value){
    const t = tiles[key];
    if (t.value === value) return;
    const oldValue = t.value === null ? value : t.value;
    t.timers.forEach(id => clearTimeout(id));
    t.timers = [];
    setLongClass(key, value);

    // Reveal the new value underneath immediately; the top leaf (still
    // showing the old value) will fold away to expose it.
    t.staticTop.textContent = value;
    t.leafTopText.textContent = oldValue;
    t.leafBottomText.textContent = value;

    t.leafTop.style.transition = 'none';
    t.leafTop.style.transform = 'rotateX(0deg)';
    t.leafBottom.style.transition = 'none';
    t.leafBottom.style.transform = 'rotateX(90deg)';
    void t.leafTop.offsetHeight; // force reflow so the transition below retriggers

    requestAnimationFrame(() => {
      t.leafTop.style.transition = `transform ${FLIP_MS}ms cubic-bezier(.45,0,.2,1)`;
      t.leafTop.style.transform = 'rotateX(-90deg)';
    });

    const timer1 = setTimeout(() => {
      // Top leaf has folded away; the new bottom half now flips into place.
      t.staticBottom.textContent = value;
      t.leafBottom.style.transition = `transform ${FLIP_MS}ms cubic-bezier(.45,0,.2,1)`;
      t.leafBottom.style.transform = 'rotateX(0deg)';
    }, FLIP_MS);

    t.timers.push(timer1);
    t.value = value;
  }

  /* =========================================================
     TIMER LOGIC — starts at zero, presets + custom minutes.
  ========================================================= */
  const stopBtn = document.getElementById('stopBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const pauseBtnLabel = document.getElementById('pauseBtnLabel');
  const pauseBtnIconPath = document.getElementById('pauseBtnIconPath');
  const presetsWrap = document.getElementById('presets');
  const customPill = document.getElementById('customPill');
  const customMinInput = document.getElementById('customMinInput');
  const customSecInput = document.getElementById('customSecInput');
  const statusDot = document.getElementById('statusDot');

  const PLAY_PATH = "M8 5v14l11-7z";
  const PAUSE_PATH = "M7 5h4v14H7zM13 5h4v14h-4z";

  let totalSeconds = 0;   // full duration of the current timer
  let remaining = 0;      // seconds left
  let intervalId = null;
  let running = false;

  function pad2(n){ return n.toString().padStart(2, '0'); }

  function renderClock(instant){
    const d = Math.floor(remaining / 86400);
    const h = Math.floor((remaining % 86400) / 3600);
    const m = Math.floor((remaining % 3600) / 60);
    const s = Math.floor(remaining % 60);
    const parts = { days: pad2(d), hours: pad2(h), minutes: pad2(m), seconds: pad2(s) };

    Object.keys(parts).forEach(key => {
      if (instant){
        setTileInstant(key, parts[key]);
      } else {
        flipTileTo(key, parts[key]);
      }
    });
  }

  function setToggleIcon(isPlaying){
    pauseBtnLabel.textContent = isPlaying ? 'Pause' : 'Resume';
    pauseBtnIconPath.setAttribute('d', isPlaying ? PAUSE_PATH : PLAY_PATH);
    statusDot.classList.toggle('live', isPlaying);
  }

  function setActivePill(btn){
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    if (btn) btn.classList.add('active');
  }

  function resetToZero(){
    clearInterval(intervalId);
    intervalId = null;
    running = false;
    totalSeconds = 0;
    remaining = 0;
    renderClock(true);
    setToggleIcon(false);
    stopBtn.disabled = true;
    pauseBtn.disabled = true;
    setActivePill(null);
  }

  function tick(){
    remaining -= 1;
    if (remaining <= 0){
      remaining = 0;
      renderClock(false);
      pause();
      return;
    }
    renderClock(false);
  }

  function play(){
    if (totalSeconds <= 0) return;
    running = true;
    setToggleIcon(true);
    intervalId = setInterval(tick, 1000);
  }

  function pause(){
    running = false;
    clearInterval(intervalId);
    intervalId = null;
    setToggleIcon(false);
  }

  function startTimer(seconds, sourcePill){
    if (!seconds || seconds <= 0) return;
    clearInterval(intervalId);
    totalSeconds = Math.round(seconds);
    remaining = totalSeconds;
    renderClock(true);
    stopBtn.disabled = false;
    pauseBtn.disabled = false;
    setActivePill(sourcePill);
    play();
  }

  // Preset buttons
  presetsWrap.querySelectorAll('.pill[data-mins]').forEach(btn => {
    btn.addEventListener('click', () => {
      customMinInput.value = "";
      customSecInput.value = "";
      startTimer(Number(btn.dataset.mins) * 60, btn);
    });
  });

  // Custom minutes + seconds inputs (numeric-only text fields, avoids native
  // number-input width quirks)
  function commitCustom(){
    const mins = Number(customMinInput.value) || 0;
    const secs = Number(customSecInput.value) || 0;
    const total = mins * 60 + secs;
    if (total > 0){
      startTimer(total, customPill);
    }
  }
  customMinInput.addEventListener('input', () => {
    customMinInput.value = customMinInput.value.replace(/[^0-9]/g, '').slice(0, 6);
  });
  customSecInput.addEventListener('input', () => {
    let digits = customSecInput.value.replace(/[^0-9]/g, '').slice(0, 2);
    if (digits !== '' && Number(digits) > 59) digits = '59';
    customSecInput.value = digits;
  });
  [customMinInput, customSecInput].forEach(input => {
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') commitCustom();
    });
    input.addEventListener('change', commitCustom);
  });

  // Pause / Resume button
  pauseBtn.addEventListener('click', () => {
    if (totalSeconds <= 0) return;
    if (running) pause(); else play();
  });

  // Stop button — returns everything to zero
  stopBtn.addEventListener('click', resetToZero);

  // Initial state: zero, nothing selected
  resetToZero();

})();
</script>
</body>
</html>
