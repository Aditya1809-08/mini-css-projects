
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1: #0b1638;
    --bg-2: #0f2a5e;
    --bg-3: #071026;

    --ink: #e8542c;
    --ink-strong: #d1451f;
    --muted: #b56a4a;

    --pill-idle-bg: #ffffff;
    --pill-idle-text: #b8531f;
    --pill-active-bg: #ff7a3d;
    --pill-active-text: #ffffff;
    --pill-shadow: rgba(150,70,20,0.18);

    --tile-bg-top: #ffab5c;
    --tile-bg-mid: #ff7a3d;
    --tile-bg-bottom: #ee5a34;
    --tile-text: #ffffff;
    --tile-shadow: rgba(150,50,10,0.4);
    --tile-hinge: rgba(0,0,0,0.28);
    --tile-dot: rgba(255,255,255,0.6);

    --stop-bg: #ffffff;
    --stop-text: #e8542c;
    --stop-shadow: rgba(150,50,10,0.28);

    --pause-bg: rgba(255,255,255,0.2);
    --pause-text: #ffffff;
    --pause-border: rgba(255,255,255,0.4);

    --label-text: rgba(255,255,255,0.9);
    --hint-text: rgba(255,255,255,0.8);
  }

  *{ box-sizing: border-box; }
  html, body{ height: 100%; margin: 0; overflow-x: hidden; }

  body{
    font-family: 'Inter', -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(24px, 4vw, 36px);
    padding: max(28px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: radial-gradient(circle at 82% 8%, #17306b 0%, transparent 40%), linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
    background-image: var(--bg-url, none), radial-gradient(circle at 82% 8%, #17306b 0%, transparent 40%), linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
    background-size: cover, auto, auto;
    background-position: center, center, center;
    background-repeat: no-repeat;
    position: relative;
  }

  /* ---------- Decorative space elements (behind the content) ---------- */
  .stars-layer{
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  .stars-layer .stars-a, .stars-layer .stars-b{
    position: absolute;
    top: 0; left: 0;
    width: 1px; height: 1px;
    border-radius: 50%;
    background: transparent;
  }
  .stars-layer .stars-a{ box-shadow: 663px 970px 0 #fff, 308px 404px 0 #fff, 1333px 49px 0 #fff, 148px 840px 0 #fff, 1097px 96px 0 #fff, 748px 596px 0 #fff, 118px 931px 0 #fff, 1039px 219px 0 #fff, 76px 88px 0 #fff, 888px 428px 0 #fff, 143px 246px 0 #fff, 185px 564px 0 #fff, 869px 60px 0 #fff, 1158px 126px 0 #fff, 457px 645px 0 #fff, 1284px 596px 0 #fff, 126px 590px 0 #fff, 1199px 406px 0 #fff, 101px 999px 0 #fff, 452px 47px 0 #fff, 1140px 879px 0 #fff, 272px 296px 0 #fff, 858px 147px 0 #fff, 1107px 120px 0 #fff, 1169px 315px 0 #fff, 1147px 835px 0 #fff, 1396px 185px 0 #fff, 211px 595px 0 #fff, 1169px 654px 0 #fff, 384px 381px 0 #fff, 199px 560px 0 #fff, 1458px 64px 0 #fff, 1155px 61px 0 #fff, 1267px 210px 0 #fff, 1016px 696px 0 #fff, 1088px 437px 0 #fff, 1591px 321px 0 #fff, 953px 599px 0 #fff, 928px 370px 0 #fff, 613px 254px 0 #fff, 368px 715px 0 #fff, 1597px 249px 0 #fff, 167px 588px 0 #fff, 614px 537px 0 #fff, 1013px 896px 0 #fff, 703px 746px 0 #fff, 919px 294px 0 #fff, 1247px 74px 0 #fff, 241px 524px 0 #fff, 856px 168px 0 #fff, 1550px 350px 0 #fff, 311px 955px 0 #fff, 1001px 431px 0 #fff, 80px 985px 0 #fff, 1368px 79px 0 #fff, 1565px 571px 0 #fff, 1173px 808px 0 #fff, 642px 348px 0 #fff, 1423px 358px 0 #fff, 1217px 508px 0 #fff, 1187px 816px 0 #fff, 934px 70px 0 #fff, 191px 967px 0 #fff, 552px 485px 0 #fff, 1427px 680px 0 #fff, 133px 62px 0 #fff, 1497px 718px 0 #fff, 634px 662px 0 #fff, 1183px 697px 0 #fff, 912px 291px 0 #fff, 1467px 395px 0 #fff, 1369px 355px 0 #fff, 46px 963px 0 #fff, 945px 363px 0 #fff, 344px 625px 0 #fff, 239px 505px 0 #fff, 120px 223px 0 #fff, 1573px 294px 0 #fff, 264px 756px 0 #fff, 507px 407px 0 #fff, 800px 938px 0 #fff, 1016px 82px 0 #fff, 340px 459px 0 #fff, 822px 562px 0 #fff, 569px 904px 0 #fff, 280px 838px 0 #fff, 881px 884px 0 #fff, 1126px 285px 0 #fff, 1446px 425px 0 #fff, 734px 699px 0 #fff; animation: twinkle 3.4s ease-in-out infinite; }
  .stars-layer .stars-b{ box-shadow: 779px 980px 0 2px #fff, 472px 154px 0 2px #fff, 169px 180px 0 2px #fff, 309px 237px 0 2px #fff, 1348px 238px 0 2px #fff, 24px 496px 0 2px #fff, 1206px 186px 0 2px #fff, 538px 288px 0 2px #fff, 8px 149px 0 2px #fff, 858px 547px 0 2px #fff, 756px 624px 0 2px #fff, 1159px 326px 0 2px #fff, 257px 707px 0 2px #fff, 1055px 973px 0 2px #fff, 1264px 670px 0 2px #fff, 1384px 757px 0 2px #fff, 110px 467px 0 2px #fff, 1393px 817px 0 2px #fff, 1145px 401px 0 2px #fff, 815px 408px 0 2px #fff, 807px 106px 0 2px #fff, 986px 649px 0 2px #fff, 820px 63px 0 2px #fff, 390px 68px 0 2px #fff, 427px 451px 0 2px #fff, 332px 112px 0 2px #fff, 696px 615px 0 2px #fff, 107px 104px 0 2px #fff, 309px 549px 0 2px #fff, 207px 971px 0 2px #fff, 744px 628px 0 2px #fff, 52px 72px 0 2px #fff, 425px 628px 0 2px #fff, 770px 152px 0 2px #fff, 1299px 258px 0 2px #fff, 711px 616px 0 2px #fff, 745px 485px 0 2px #fff, 251px 118px 0 2px #fff, 999px 477px 0 2px #fff, 983px 495px 0 2px #fff, 638px 87px 0 2px #fff, 295px 104px 0 2px #fff, 1535px 350px 0 2px #fff, 1516px 271px 0 2px #fff, 980px 848px 0 2px #fff, 1417px 165px 0 2px #fff, 1057px 23px 0 2px #fff, 420px 973px 0 2px #fff; animation: twinkle 4.6s ease-in-out infinite 1.2s; }
  @keyframes twinkle{
    0%, 100%{ opacity: 0.9; }
    50%{ opacity: 0.35; }
  }

  .moon-decor{
    position: fixed;
    top: -70px; right: -70px;
    width: 220px; height: 220px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 32%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 8%),
      radial-gradient(circle at 62% 55%, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 10%),
      radial-gradient(circle at 45% 45%, #fdf3d3 0%, #f3d99a 55%, #e2b768 100%);
    box-shadow: 0 0 70px 20px rgba(243,217,154,0.35);
    z-index: 0;
    pointer-events: none;
    animation: glowPulse 7s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%, 100%{ box-shadow: 0 0 70px 20px rgba(243,217,154,0.3); }
    50%{ box-shadow: 0 0 90px 26px rgba(243,217,154,0.45); }
  }

  .planet-decor{
    position: fixed;
    bottom: -60px; left: -60px;
    width: 190px; height: 190px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #7fe3d0 0%, #2f9e9c 55%, #146a72 100%);
    box-shadow: 0 0 60px 18px rgba(63,208,201,0.28);
    z-index: 0;
    pointer-events: none;
  }

  .ufo-decor{
    position: fixed;
    width: 74px; height: auto;
    z-index: 0;
    pointer-events: none;
    animation: driftSide 22s ease-in-out infinite;
  }
  .ufo-decor.ufo-1{ top: 20%; left: 8%; }
  .ufo-decor.ufo-2{ top: 10%; left: 58%; width: 56px; animation-duration: 26s; animation-delay: 2s; }
  @keyframes driftSide{
    0%, 100%{ transform: translateX(0) translateY(0); }
    50%{ transform: translateX(14px) translateY(-8px); }
  }

  .rocket-decor{
    position: fixed;
    top: 12%; right: 14%;
    width: 70px; height: auto;
    z-index: 0;
    pointer-events: none;
    animation: rocketBob 5s ease-in-out infinite;
  }
  @keyframes rocketBob{
    0%, 100%{ transform: translateY(0) rotate(28deg); }
    50%{ transform: translateY(-10px) rotate(28deg); }
  }

  .astronaut-decor{
    position: fixed;
    bottom: 6%; left: 6%;
    width: 90px; height: auto;
    z-index: 0;
    pointer-events: none;
    animation: astronautFloat 8s ease-in-out infinite;
  }
  @keyframes astronautFloat{
    0%, 100%{ transform: translateY(0) rotate(-4deg); }
    50%{ transform: translateY(-14px) rotate(4deg); }
  }

  /* keep real content above the decorations */
  .presets, .clock-wrap, .home-indicator, .hint{
    position: relative;
    z-index: 1;
  }

  .fullscreen-btn{
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    right: max(16px, env(safe-area-inset-right));
    width: 42px; height: 42px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(6px);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 2;
    transition: background 0.2s ease, transform 0.1s ease;
  }
  .fullscreen-btn:hover{ background: rgba(255,255,255,0.3); }
  .fullscreen-btn:active{ transform: scale(0.94); }
  .fullscreen-btn svg{ width: 20px; height: 20px; }

  @media (max-width: 560px){
    .moon-decor{ width: 160px; height: 160px; top: -55px; right: -55px; }
    .planet-decor{ width: 140px; height: 140px; bottom: -50px; left: -50px; }
    .ufo-decor{ width: 58px; }
    .rocket-decor{ width: 54px; }
    .astronaut-decor{ width: 70px; }
  }

  .presets{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .presets button{ border:none; cursor:pointer; font-family:inherit; font-size:15px; font-weight:600; padding:12px 18px; border-radius:16px; background:var(--pill-idle-bg); color:var(--pill-idle-text); box-shadow:0 6px 16px var(--pill-shadow); transition:background .2s,color .2s,transform .1s; }
  .presets button.active{ background:var(--pill-active-bg); color:var(--pill-active-text); }
  .presets button:active{ transform:scale(.97); }
  .clock-wrap{ display:flex; flex-direction:column; align-items:center; gap:20px; width:min(94vw,480px); }
  .time-display{ font-family:'Space Grotesk','Inter',sans-serif; font-size:clamp(64px,18vw,110px); font-weight:700; color:#fff; line-height:1; letter-spacing:.02em; font-variant-numeric:tabular-nums; text-shadow:0 10px 28px rgba(0,0,0,.22); }
  .colon{ opacity:.75; padding:0 4px; }
  .labels{ display:flex; justify-content:center; gap:60px; color:var(--label-text); font-size:12px; font-weight:700; letter-spacing:.12em; }
  .controls{ display:flex; gap:10px; width:min(320px,90vw); }
  .stop-btn,.pause-btn{ flex:1; border:1px solid transparent; padding:12px 16px; border-radius:15px; font:600 15px inherit; cursor:pointer; }
  .stop-btn{ background:var(--stop-bg); color:var(--stop-text); box-shadow:0 10px 22px var(--stop-shadow); }
  .pause-btn{ background:var(--pause-bg); color:var(--pause-text); border-color:var(--pause-border); backdrop-filter:blur(6px); }
  .hint{ color:var(--hint-text); font-size:13px; font-weight:500; text-align:center; }
  .home-indicator{ width:130px; height:5px; border-radius:999px; background:rgba(255,255,255,.5); }
</style>
</head>
<body>
  <div class="stars-layer" aria-hidden="true">
    <div class="stars-a"></div>
    <div class="stars-b"></div>
  </div>
  <div class="moon-decor" aria-hidden="true"></div>
  <div class="planet-decor" aria-hidden="true"></div>
  <img class="ufo-decor ufo-1" src="4b05811633ca657e65e685dc0ac353b5.jpg" alt="" aria-hidden="true">
  <img class="ufo-decor ufo-2" src="4b05811633ca657e65e685dc0ac353b5.jpg" alt="" aria-hidden="true">
  <img class="rocket-decor" src="download.png" alt="" aria-hidden="true">
  <img class="astronaut-decor" src="download.png" alt="" aria-hidden="true">

  <button class="fullscreen-btn" id="fullscreenBtn" type="button" aria-label="Toggle fullscreen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
      <path d="M16 3h3a2 2 0 0 1 2 2v3"></path>
      <path d="M21 16v3a2 2 0 0 1-2 2h-3"></path>
      <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
    </svg>
  </button>

  <div class="presets">
    <button type="button">15m</button>
    <button type="button" class="active">30m</button>
    <button type="button">45m</button>
    <button type="button">60m</button>
  </div>

  <main class="clock-wrap" aria-label="Stopwatch timer">
    <div class="time-display">
      <span id="minutes">30</span><span class="colon">:</span><span id="seconds">00</span>
    </div>
    <div class="labels"><span>MINUTES</span><span>SECONDS</span></div>
    <div class="controls">
      <button class="stop-btn" id="stopBtn" type="button">Stop</button>
      <button class="pause-btn" id="pauseBtn" type="button">Pause</button>
    </div>
  </main>

  <div class="hint">Tap Pause to pause the timer</div>
  <div class="home-indicator" aria-hidden="true"></div>

<script>
(() => {
  let totalSeconds = 30 * 60;
  let remaining = totalSeconds;
  let interval = null;
  const minutesEl = document.getElementById('minutes');
  const secondsEl = document.getElementById('seconds');
  const pauseBtn = document.getElementById('pauseBtn');
  const stopBtn = document.getElementById('stopBtn');
  const presetBtns = [...document.querySelectorAll('.presets button')];
  const fullscreenBtn = document.getElementById('fullscreenBtn');

  function render(){
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    minutesEl.textContent = String(m).padStart(2, '0');
    secondsEl.textContent = String(s).padStart(2, '0');
  }

  function tick(){
    if (remaining > 0){
      remaining--;
      render();
    } else {
      clearInterval(interval);
      interval = null;
      pauseBtn.textContent = 'Start';
    }
  }

  function start(){
    if (interval || remaining <= 0) return;
    interval = setInterval(tick, 1000);
    pauseBtn.textContent = 'Pause';
  }

  function togglePause(){
    if (interval){
      clearInterval(interval);
      interval = null;
      pauseBtn.textContent = 'Start';
    } else {
      start();
    }
  }

  function stop(){
    clearInterval(interval);
    interval = null;
    remaining = totalSeconds;
    pauseBtn.textContent = 'Start';
    render();
  }

  presetBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const value = parseInt(btn.textContent, 10);
      totalSeconds = value * 60;
      remaining = totalSeconds;
      clearInterval(interval);
      interval = null;
      pauseBtn.textContent = 'Start';
      presetBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  pauseBtn.addEventListener('click', togglePause);
  stopBtn.addEventListener('click', stop);
  fullscreenBtn.addEventListener('click', async () => {
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch (_) {}
  });

  render();
  start();
})();
</script>
</body>
</html>
