<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Premium Glass Calendar</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0c0d14;
      background-image: 
        linear-gradient(rgba(0, 198, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 198, 255, 0.02) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* Refined Specular Glass Finish */
    .premium-glass {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 
        0 40px 80px rgba(0, 0, 0, 0.65),
        inset 0 1px 1px rgba(255, 255, 255, 0.25);
    }

    .fade-transition {
      transition: opacity 0.2s ease-in-out, transform 0.2s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen w-screen flex items-center justify-center p-4 sm:p-6 md:p-10 lg:p-12 relative overflow-x-hidden">

  <!-- 1. Ambient Background Glows -->
  <div class="absolute top-[5%] right-[10%] w-[300px] sm:w-[450px] h-[300px] sm:h-[450px] rounded-full bg-purple-600/15 blur-[80px] sm:blur-[100px] pointer-events-none z-0"></div>
  <div class="absolute bottom-[10%] left-[5%] w-[350px] sm:w-[550px] h-[350px] sm:h-[550px] rounded-full bg-[#00c6ff]/15 blur-[90px] sm:blur-[110px] pointer-events-none z-0"></div>

  <!-- 2. Responsive Floating Specular Glass Rings -->
  <div class="absolute top-[10%] left-[5%] w-20 h-20 sm:w-32 sm:h-32 rounded-full border border-white/20 bg-white/5 backdrop-blur-[3px] shadow-sm pointer-events-none z-0"></div>
  <div class="absolute bottom-[15%] right-[3%] w-28 h-28 sm:w-48 sm:h-48 rounded-full border border-white/10 bg-white/5 backdrop-blur-[2px] shadow-sm pointer-events-none z-0"></div>
  <div class="absolute top-[45%] right-[35%] w-14 h-14 sm:w-20 sm:h-20 rounded-full border border-white/20 bg-white/5 backdrop-blur-[4px] shadow-sm pointer-events-none z-0"></div>

  <!-- Main Container: Fluid flex/grid that fills screen nicely on PC and stacks on Mobile -->
  <div class="w-full max-w-[1240px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 xl:gap-16 items-center relative z-10 px-2 sm:px-4">
    
    <!-- LEFT COLUMN: Ticket Pass and Header Styling (PC: 5 Cols, Mobile: Stacked) -->
    <div class="lg:col-span-5 flex flex-col gap-6 lg:gap-8">
      
      <!-- Studio Header Accent -->
      <div class="flex items-center gap-4">
        <span class="text-xs font-bold tracking-[0.25em] text-[#00c6ff]">STUDIO K</span>
        <div class="flex-1 h-[1px] bg-gradient-to-r from-[#00c6ff]/60 to-transparent"></div>
      </div>

      <!-- Responsive Responsive Title Text -->
      <h1 class="text-2xl sm:text-3xl lg:text-4xl font-light text-slate-100 leading-tight">
        How I organize my <br>
        <span class="text-4xl sm:text-5xl lg:text-6xl font-black tracking-tight bg-gradient-to-r from-[#6366f1] via-[#0ea5e9] to-[#00d2ff] bg-clip-text text-transparent block my-2">Schedule</span>
        through strategic planning.
      </h1>

      <!-- Dynamic Ticket Pass Widget (Fluid Height and Width) -->
      <div class="relative premium-glass w-full h-[190px] sm:h-[220px] lg:h-[250px] rounded-3xl p-5 sm:p-6 lg:p-8 flex flex-col justify-between overflow-hidden">
        <!-- Ticket Bites (Cutout notches with responsive sizes) -->
        <div class="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-1/2 w-5 h-5 lg:w-7 lg:h-7 rounded-full bg-[#0c0d14] border-r border-white/10 shadow-inner z-10"></div>
        <div class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-1/2 w-5 h-5 lg:w-7 lg:h-7 rounded-full bg-[#0c0d14] border-l border-white/10 shadow-inner z-10"></div>
        
        <!-- Perforation Line -->
        <div class="absolute left-5 sm:left-6 lg:left-8 right-5 sm:right-6 lg:right-8 top-1/2 -translate-y-1/2 border-t border-dashed border-white/15 pointer-events-none"></div>

        <!-- Upper Half (Date Data) -->
        <div class="flex justify-between items-start z-10">
          <div>
            <span class="text-[9px] lg:text-[10px] uppercase tracking-wider text-slate-400 font-semibold block">Date Selected</span>
            <span id="ticket-day-name" class="text-lg sm:text-xl lg:text-2xl font-bold text-white">Tuesday</span>
            <span id="ticket-month-year" class="text-[11px] lg:text-xs text-slate-400 block mt-0.5">June, 2026</span>
          </div>
          <div class="text-right">
            <span class="text-[9px] lg:text-[10px] uppercase tracking-wider text-slate-400 font-semibold block">Pass Code</span>
            <span id="ticket-day-number" class="text-3xl sm:text-4xl lg:text-5xl font-black text-white bg-gradient-to-tr from-[#6366f1] to-[#00c6ff] bg-clip-text text-transparent tracking-tight">16</span>
          </div>
        </div>

        <!-- Lower Half (Branding & Navigation) -->
        <div class="flex justify-between items-end z-10">
          <div>
            <span class="text-xs sm:text-sm lg:text-base font-bold text-white bg-gradient-to-r from-[#6366f1] to-[#0ea5e9] bg-clip-text text-transparent">Interface UI</span>
            <span class="text-[8px] lg:text-[9px] text-slate-400 block tracking-wider">Ticket de passagem</span>
            <!-- Custom Indicator dots -->
            <div class="flex gap-1 mt-1.5">
              <span class="w-1 h-1 lg:w-1.5 lg:h-1.5 rounded-full bg-[#00c6ff]"></span>
              <span class="w-1 h-1 lg:w-1.5 lg:h-1.5 rounded-full bg-[#00c6ff]"></span>
              <span class="w-1 h-1 lg:w-1.5 lg:h-1.5 rounded-full bg-[#00c6ff]"></span>
              <span class="w-1 h-1 lg:w-1.5 lg:h-1.5 rounded-full bg-slate-600"></span>
              <span class="w-1 h-1 lg:w-1.5 lg:h-1.5 rounded-full bg-slate-600"></span>
            </div>
          </div>

          <!-- Month Navigators nested directly on the Ticket -->
          <div class="flex gap-2">
            <button onclick="changeMonth(-1)" class="w-7 h-7 sm:w-8 sm:h-8 lg:w-9 lg:h-9 rounded-full border border-white/10 bg-white/5 hover:bg-white/10 active:scale-95 transition-all flex items-center justify-center text-white shadow-sm">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
              </svg>
            </button>
            <button onclick="changeMonth(1)" class="w-7 h-7 sm:w-8 sm:h-8 lg:w-9 lg:h-9 rounded-full border border-white/10 bg-white/5 hover:bg-white/10 active:scale-95 transition-all flex items-center justify-center text-white shadow-sm">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Static Footer Branding details on PC layout -->
      <div class="hidden lg:flex justify-between text-[11px] font-bold text-slate-500 tracking-[0.2em] uppercase mt-2 px-1">
        <span>Interface</span>
        <span>2026</span>
        <span>Jul</span>
      </div>
    </div>

    <!-- RIGHT COLUMN: Scaled-up Calendar Grid (PC: 7 Cols, Mobile: Stacked) -->
    <div class="lg:col-span-7 w-full">
      <div class="premium-glass w-full rounded-[32px] p-5 sm:p-6 lg:p-10 flex flex-col justify-between shadow-2xl shadow-black/40">
        
        <!-- Grid Header -->
        <div class="flex justify-between items-center mb-5 lg:mb-8 pb-3 lg:pb-5 border-b border-white/10">
          <span id="grid-month-label" class="text-lg sm:text-xl lg:text-3xl font-bold text-white tracking-wide">June 2026</span>
          <span class="text-[10px] sm:text-xs font-semibold text-[#00c6ff] tracking-wider uppercase bg-[#00c6ff]/10 px-3 py-1 rounded-full">Calendar View</span>
        </div>

        <!-- Weekdays Row (Consistent grid layout) -->
        <div class="grid grid-cols-7 text-center mb-3 sm:mb-4 lg:mb-6">
          <span class="text-[10px] sm:text-[11px] lg:text-xs font-bold tracking-widest text-slate-400">MON</span>
          <span class="text-[10px] sm:text-[11px] lg:text-xs font-bold tracking-widest text-slate-400">TUE</span>
          <span class="text-[10px] sm:text-[11px] lg:text-xs font-bold tracking-widest text-slate-400">WED</span>
          <span class="text-[10px] sm:text-[11px] lg:text-xs font-bold tracking-widest text-slate-400">THU</span>
          <span class="text-[10px] sm:text-[11px] lg:text-xs font-bold tracking-widest text-slate-400">FRI</span>
          <span class="text-[10px] sm:text-[11px] lg:text-xs font-bold tracking-widest text-slate-400">SAT</span>
          <span class="text-[10px] sm:text-[11px] lg:text-xs font-bold tracking-widest text-slate-400">SUN</span>
        </div>

        <!-- Dynamic Responsive Grid cells -->
        <div id="calendar-grid" class="fade-transition grid grid-cols-7 gap-x-1 sm:gap-x-2 gap-y-2 sm:gap-y-3 lg:gap-y-4 text-center justify-items-center">
          <!-- Injected dynamically by JS -->
        </div>

      </div>
    </div>

  </div>

  <script>
    // 1. Initialize State with Current Live Date
    const today = new Date();
    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth(); // 0-indexed
    let selectedDay = today.getDate();

    const monthNames = [
      "January", "February", "March", "April", "May", "June", 
      "July", "August", "September", "October", "November", "December"
    ];

    const weekdayNames = [
      "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"
    ];

    const gridContainer = document.getElementById('calendar-grid');
    const gridMonthLabel = document.getElementById('grid-month-label');
    
    // Ticket elements
    const ticketDayName = document.getElementById('ticket-day-name');
    const ticketMonthYear = document.getElementById('ticket-month-year');
    const ticketDayNumber = document.getElementById('ticket-day-number');

    // 2. Calendar Grid Renderer
    function renderCalendar(year, month) {
      // Update Grid Labels
      gridMonthLabel.innerText = `${monthNames[month]} ${year}`;
      
      // Clear previous grid items
      gridContainer.innerHTML = '';

      const firstDayIndex = new Date(year, month, 1).getDay();
      const adjustedStartDay = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;

      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();

      const totalCellsNeeded = adjustedStartDay + daysInMonth;
      const totalGridCells = totalCellsNeeded > 35 ? 42 : 35;

      // Render Padding Days from Previous Month (Dynamic scaling styling classes)
      for (let i = adjustedStartDay; i > 0; i--) {
        const prevDayVal = daysInPrevMonth - i + 1;
        const cell = document.createElement('div');
        cell.className = 'w-10 h-10 sm:w-12 sm:h-12 lg:w-16 lg:h-16 flex items-center justify-center text-xs sm:text-sm lg:text-lg font-medium text-slate-600 cursor-pointer hover:text-slate-400 transition-colors';
        cell.innerText = prevDayVal;
        cell.onclick = () => {
          changeMonth(-1);
          selectedDay = prevDayVal;
        };
        gridContainer.appendChild(cell);
      }

      // Render Active Days of Selected Month
      for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement('div');
        cell.className = 'w-10 h-10 sm:w-12 sm:h-12 lg:w-16 lg:h-16 flex items-center justify-center relative';

        const button = document.createElement('button');
        button.innerText = day;
        button.className = 'w-9 h-9 sm:w-11 sm:h-11 lg:w-14 lg:h-14 flex items-center justify-center text-xs sm:text-sm lg:text-lg font-semibold rounded-full transition-all duration-200';

        if (day === selectedDay) {
          // Responsive glowing selected target
          button.className += ' bg-gradient-to-tr from-[#6366f1] to-[#00c6ff] text-white shadow-lg shadow-indigo-500/30 font-bold';
        } else {
          button.className += ' text-white/90 hover:bg-white/10 active:scale-95 border border-transparent hover:border-white/10';
        }

        button.onclick = () => {
          selectedDay = day;
          renderCalendar(year, month);
          updateTicket();
        };

        cell.appendChild(button);
        gridContainer.appendChild(cell);
      }

      // Render Padding Days of Next Month
      const currentRenderCount = adjustedStartDay + daysInMonth;
      const trailingDaysCount = totalGridCells - currentRenderCount;

      for (let day = 1; day <= trailingDaysCount; day++) {
        const cell = document.createElement('div');
        cell.className = 'w-10 h-10 sm:w-12 sm:h-12 lg:w-16 lg:h-16 flex items-center justify-center text-xs sm:text-sm lg:text-lg font-medium text-slate-600 cursor-pointer hover:text-slate-400 transition-colors';
        cell.innerText = day;
        cell.onclick = () => {
          changeMonth(1);
          selectedDay = day;
        };
        gridContainer.appendChild(cell);
      }

      updateTicket();
    }

    // 3. Update Left Ticket Panel dynamically
    function updateTicket() {
      const selectedDateObj = new Date(currentYear, currentMonth, selectedDay);
      
      ticketDayName.innerText = weekdayNames[selectedDateObj.getDay()];
      ticketMonthYear.innerText = `${monthNames[currentMonth]}, ${currentYear}`;
      ticketDayNumber.innerText = String(selectedDay).padStart(2, '0');
    }

    // 4. Navigation Controller
    function changeMonth(direction) {
      gridContainer.style.opacity = '0';
      gridContainer.style.transform = 'scale(0.98)';

      setTimeout(() => {
        currentMonth += direction;
        if (currentMonth < 0) {
          currentMonth = 11;
          currentYear -= 1;
        } else if (currentMonth > 11) {
          currentMonth = 0;
          currentYear += 1;
        }

        const daysInTargetMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        if (selectedDay > daysInTargetMonth) {
          selectedDay = daysInTargetMonth;
        }

        renderCalendar(currentYear, currentMonth);

        gridContainer.style.opacity = '1';
        gridContainer.style.transform = 'scale(1)';
      }, 180);
    }

    // Initial render call
    renderCalendar(currentYear, currentMonth);
  </script>
</body>
</html>
