<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Glassmorphism Dashboard</title>h
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>s
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      /* Replicating the purple-blue gradient from your image using CSS */
      background-color: #170731;
      background-image: 
        radial-gradient(circle at 12% 55%, rgba(224, 200, 255, 0.95) 0%, rgba(139, 92, 246, 0.5) 40%, transparent 80%),
        radial-gradient(circle at 40% 15%, rgba(29, 78, 216, 0.95) 0%, rgba(76, 29, 149, 0.8) 55%, transparent 85%),
        radial-gradient(circle at 95% 45%, rgba(10, 15, 30, 0.95) 0%, rgba(40, 12, 90, 0.9) 60%, rgba(10, 15, 30, 1) 100%);
      background-attachment: fixed;
    }

    /* Soft, pristine light glass panel */
    .light-glass {
      background: rgba(255, 255, 255, 0.52);
      backdrop-filter: blur(30px) saturate(140%);
      -webkit-backdrop-filter: blur(30px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: 
        0 40px 80px rgba(0, 0, 0, 0.22),
        inset 0 1px 1px rgba(255, 255, 255, 0.5);
    }

    .fade-transition {
      transition: opacity 0.18s ease-in-out, transform 0.18s ease-in-out;
    }

    /* Styled custom scrollbar for notes/tasks */
    #task-list::-webkit-scrollbar {
      width: 4px;
    }
    #task-list::-webkit-scrollbar-track {
      background: transparent;
    }
    #task-list::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.1);
      border-radius: 4px;
    }
    #task-list::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body class="min-h-screen w-screen flex items-center justify-center p-4 sm:p-6 md:p-10 lg:p-12 overflow-x-hidden">

  <!-- Main Grid Wrapper -->
  <div class="w-full max-w-[1200px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 sm:gap-8 lg:gap-10 items-stretch relative z-10">
    
    <!-- LEFT PANEL: Dynamic Clock, Greeting & Task Manager (PC: 4 Cols, Mobile: Stacked) -->
    <div class="lg:col-span-4 flex flex-col gap-6 h-full">
      
      <!-- Greeting and Time Card -->
      <div class="light-glass rounded-[32px] p-6 flex flex-col justify-between shadow-xl">
        <div class="flex flex-col gap-1">
          <span class="text-xs font-bold tracking-widest text-slate-500 uppercase">Live Dashboard</span>
          <h2 id="live-greeting" class="text-2xl font-bold text-slate-800">Good Night</h2>
          <span id="live-date" class="text-xs font-medium text-slate-600">Wednesday, June 17, 2026</span>
        </div>
        
        <!-- Large Digital Clock -->
        <div class="mt-6 pt-4 border-t border-black/5 flex items-baseline justify-between">
          <div id="live-clock" class="text-3xl sm:text-4xl font-extrabold text-slate-800 tracking-tight">12:53:00</div>
          <span id="clock-ampm" class="text-sm font-bold text-[#7c3aed] uppercase tracking-wider">PM</span>
        </div>
      </div>

      <!-- Interactive Focus Task Manager -->
      <div class="light-glass rounded-[32px] p-6 flex flex-col justify-between shadow-xl flex-1 min-h-[250px]">
        <div class="flex flex-col gap-3 h-full justify-between">
          <div>
            <span class="text-xs font-bold tracking-widest text-slate-500 uppercase block mb-3">Today's Focus</span>
            <!-- Task Item Rows -->
            <div id="task-list" class="space-y-2 max-h-[140px] overflow-y-auto pr-1">
              <!-- Tasks will generate here -->
            </div>
          </div>

          <!-- Add Task Input Form -->
          <form id="task-form" onsubmit="addTask(event)" class="flex gap-2 items-center mt-4 pt-3 border-t border-black/5">
            <input type="text" id="task-input" placeholder="Add a focus target..." required
              class="flex-1 bg-white/20 hover:bg-white/30 focus:bg-white/50 text-xs text-slate-800 placeholder-slate-600/50 border border-black/5 outline-none rounded-xl px-3 py-2.5 transition-all" />
            <button type="submit" class="bg-gradient-to-tr from-[#6d28d9] to-[#8b5cf6] hover:opacity-90 active:scale-95 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition-all shadow-md">
              Add
            </button>
          </form>
        </div>
      </div>

    </div>

    <!-- RIGHT PANEL: Large Screen-Filling Calendar (PC: 8 Cols, Mobile: Stacked) -->
    <div class="lg:col-span-8 w-full">
      <div class="light-glass w-full h-full rounded-[36px] sm:rounded-[48px] p-6 sm:p-10 flex flex-col justify-between shadow-2xl">
        
        <!-- Grid Header -->
        <div class="flex justify-between items-center pb-4 sm:pb-6 border-b border-black/5">
          <!-- Previous Month Button -->
          <button onclick="changeMonth(-1)" class="w-9 h-9 rounded-full border border-black/10 bg-white/20 hover:bg-white/40 active:scale-95 transition-all flex items-center justify-center text-slate-800">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
            </svg>
          </button>

          <!-- Month & Year Label -->
          <span id="month-year-label" class="text-lg sm:text-2xl font-bold text-slate-800 tracking-wide">June 2026</span>

          <!-- Next Month Button -->
          <button onclick="changeMonth(1)" class="w-9 h-9 rounded-full border border-black/10 bg-white/20 hover:bg-white/40 active:scale-95 transition-all flex items-center justify-center text-slate-800">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
          </button>
        </div>

        <!-- Weekdays Header Row -->
        <div class="grid grid-cols-7 text-center mt-5 mb-3">
          <span class="text-[10px] sm:text-xs font-bold tracking-widest text-slate-600/70">MON</span>
          <span class="text-[10px] sm:text-xs font-bold tracking-widest text-slate-600/70">TUE</span>
          <span class="text-[10px] sm:text-xs font-bold tracking-widest text-slate-600/70">WED</span>
          <span class="text-[10px] sm:text-xs font-bold tracking-widest text-slate-600/70">THU</span>
          <span class="text-[10px] sm:text-xs font-bold tracking-widest text-slate-600/70">FRI</span>
          <span class="text-[10px] sm:text-xs font-bold tracking-widest text-slate-600/70">SAT</span>
          <span class="text-[10px] sm:text-xs font-bold tracking-widest text-slate-600/70">SUN</span>
        </div>

        <!-- Dynamic Calendar Grid -->
        <div id="calendar-grid" class="fade-transition grid grid-cols-7 gap-y-1.5 sm:gap-y-2.5 text-center flex-1 items-center justify-items-center">
          <!-- Days injected dynamically -->
        </div>

      </div>
    </div>

  </div>

  <script>
    // 1. Initialize State with Current System Date
    const today = new Date();
    const realCurrentYear = today.getFullYear();
    const realCurrentMonth = today.getMonth(); // 0-indexed
    const realCurrentDay = today.getDate();

    // Tracking calendar view state
    let viewYear = realCurrentYear;
    let viewMonth = realCurrentMonth;

    const monthNames = [
      "January", "February", "March", "April", "May", "June", 
      "July", "August", "September", "October", "November", "December"
    ];

    const weekdayNames = [
      "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"
    ];

    const gridContainer = document.getElementById('calendar-grid');
    const monthYearLabel = document.getElementById('month-year-label');

    // 2. Calendar Grid Renderer
    function renderCalendar(year, month) {
      monthYearLabel.innerText = `${monthNames[month]} ${year}`;
      gridContainer.innerHTML = '';

      const firstDayIndex = new Date(year, month, 1).getDay();
      const adjustedStartDay = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;

      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();

      const totalCellsNeeded = adjustedStartDay + daysInMonth;
      const totalGridCells = totalCellsNeeded > 35 ? 42 : 35;

      // Render Previous Month Padding Days
      for (let i = adjustedStartDay; i > 0; i--) {
        const prevDayVal = daysInPrevMonth - i + 1;
        const cell = document.createElement('div');
        cell.className = 'w-9 h-9 sm:w-12 sm:h-12 flex items-center justify-center text-xs sm:text-base font-medium text-slate-800/15';
        cell.innerText = prevDayVal;
        gridContainer.appendChild(cell);
      }

      // Render Active Days of Selected Month
      for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement('div');
        cell.className = 'w-9 h-9 sm:w-12 sm:h-12 flex items-center justify-center relative';

        const daySpan = document.createElement('span');
        daySpan.innerText = day;
        daySpan.className = 'w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center text-xs sm:text-base font-medium rounded-full';

        // ONLY highlight the present day of the present month
        const isToday = (year === realCurrentYear && month === realCurrentMonth && day === realCurrentDay);

        if (isToday) {
          daySpan.className += ' bg-gradient-to-tr from-[#6d28d9] to-[#8b5cf6] text-white font-bold shadow-[0_4px_12px_rgba(109,40,217,0.35)]';
        } else {
          daySpan.className += ' text-slate-800/80';
        }

        cell.appendChild(daySpan);
        gridContainer.appendChild(cell);
      }

      // Render Next Month Padding Days
      const currentRenderCount = adjustedStartDay + daysInMonth;
      const trailingDaysCount = totalGridCells - currentRenderCount;

      for (let day = 1; day <= trailingDaysCount; day++) {
        const cell = document.createElement('div');
        cell.className = 'w-9 h-9 sm:w-12 sm:h-12 flex items-center justify-center text-xs sm:text-base font-medium text-slate-800/15';
        cell.innerText = day;
        gridContainer.appendChild(cell);
      }
    }

    // 3. Navigation Controller
    function changeMonth(direction) {
      gridContainer.style.opacity = '0';
      gridContainer.style.transform = 'scale(0.99)';

      setTimeout(() => {
        viewMonth += direction;
        if (viewMonth < 0) {
          viewMonth = 11;
          viewYear -= 1;
        } else if (viewMonth > 11) {
          viewMonth = 0;
          viewYear += 1;
        }

        renderCalendar(viewYear, viewMonth);

        gridContainer.style.opacity = '1';
        gridContainer.style.transform = 'scale(1)';
      }, 180);
    }

    // 4. Clock and Dynamic Greeting Logic
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      
      // Update Greeting based on hours
      let greeting = "Good Night";
      if (hours >= 5 && hours < 12) greeting = "Good Morning";
      else if (hours >= 12 && hours < 17) greeting = "Good Afternoon";
      else if (hours >= 17 && hours < 21) greeting = "Good Evening";

      // Convert to 12h format
      hours = hours % 12;
      hours = hours ? hours : 12; // '0' becomes '12'
      const formattedHours = String(hours).padStart(2, '0');

      document.getElementById('live-greeting').innerText = greeting;
      document.getElementById('live-clock').innerText = `${formattedHours}:${minutes}:${seconds}`;
      document.getElementById('clock-ampm').innerText = ampm;
      document.getElementById('live-date').innerText = `${weekdayNames[now.getDay()]}, ${monthNames[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
    }

    // 5. Interactive Focus Task Manager Logic
    let focusTasks = JSON.parse(localStorage.getItem('glass_focus_tasks')) || [
      { text: "Launch new design system 🎨", completed: false },
      { text: "Drink 3L of water 💧", completed: true }
    ];

    const taskList = document.getElementById('task-list');
    const taskInput = document.getElementById('task-input');

    function renderTasks() {
      taskList.innerHTML = '';
      if (focusTasks.length === 0) {
        taskList.innerHTML = `<div class="text-slate-600/40 text-xs italic py-4 pl-1">No tasks written yet.</div>`;
        return;
      }

      focusTasks.forEach((task, index) => {
        const item = document.createElement('div');
        item.className = "flex items-center justify-between bg-white/10 hover:bg-white/20 rounded-xl px-3 py-2 transition-all border border-white/10";
        
        item.innerHTML = `
          <div class="flex items-center gap-2.5 truncate max-w-[85%]">
            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})"
              class="w-3.5 h-3.5 accent-[#7c3aed] cursor-pointer" />
            <span class="text-xs text-slate-800 truncate ${task.completed ? 'line-through text-slate-600/55' : ''}">${task.text}</span>
          </div>
          <button onclick="deleteTask(${index})" class="text-slate-600/40 hover:text-red-500 transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          </button>
        `;
        taskList.appendChild(item);
      });
    }

    function addTask(e) {
      e.preventDefault();
      const text = taskInput.value.trim();
      if (!text) return;
      focusTasks.push({ text, completed: false });
      localStorage.setItem('glass_focus_tasks', JSON.stringify(focusTasks));
      taskInput.value = '';
      renderTasks();
    }

    function toggleTask(index) {
      focusTasks[index].completed = !focusTasks[index].completed;
      localStorage.setItem('glass_focus_tasks', JSON.stringify(focusTasks));
      renderTasks();
    }

    function deleteTask(index) {
      focusTasks.splice(index, 1);
      localStorage.setItem('glass_focus_tasks', JSON.stringify(focusTasks));
      renderTasks();
    }

    // Startup Loops
    renderCalendar(viewYear, viewMonth);
    renderTasks();
    setInterval(updateClock, 1000);
    updateClock(); // Run instantly
  </script>
</body>
</html>
