<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Glassmorphism Calendar - Edge Lights</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* ==========================================
         CHANGE YOUR BACKGROUND IMAGE URL HERE 
         ========================================== */
      --bg-image-url: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070&auto=format&fit=cover');
    }

    body {
      font-family: 'Inter', sans-serif;
      background-image: var(--bg-image-url);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Edge Lights Wrapper */
    .edge-lights-wrap {
      /* Sharp 1px gradient wrapper border */
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.8), rgba(236, 72, 153, 0.5), rgba(34, 211, 238, 0.8));
      /* Ambient glow radiating outward from the edges */
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.5),
        0 0 25px rgba(139, 92, 246, 0.25),
        0 0 50px rgba(236, 72, 153, 0.15);
    }

    /* Inner Glassmorphism Card panel */
    .glass-card-inner {
      background: rgba(18, 19, 22, 0.52);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.12);
    }

    .fade-transition {
      transition: opacity 0.18s ease-in-out, transform 0.18s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen w-screen flex items-center justify-center p-4 overflow-hidden">

  <!-- Outer Edge Light Wrapper (p-[1px] generates the sharp neon outer border) -->
  <div class="edge-lights-wrap relative p-[1px] rounded-[32px] overflow-hidden">
    
    <!-- Inner Glass Card Container -->
    <div class="glass-card-inner relative w-[380px] h-[410px] rounded-[31px] p-6 flex flex-col justify-between overflow-hidden select-none">
      
      <!-- 1. Top Curved Notch Overlay -->
      <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[140px] h-[16px] z-20 pointer-events-none">
        <div class="absolute top-0 left-[15%] right-[15%] h-[2.5px] bg-gradient-to-r from-[#6d28d9] via-[#8b5cf6] to-[#6d28d9] rounded-b-full shadow-[0_1px_6px_rgba(139,92,246,0.5)]"></div>
        <svg viewBox="0 0 100 12" preserveAspectRatio="none" class="w-full h-full text-[#141518]/60 fill-current">
          <path d="M 0,0 L 18,0 C 23,0 26,12 33,12 L 67,12 C 74,12 77,0 82,0 L 100,0 Z" />
          <path d="M 0,0 L 18,0 C 23,0 26,12 33,12 L 67,12 C 74,12 77,0 82,0 L 100,0" stroke="rgba(255,255,255,0.03)" stroke-width="0.8" fill="none" />
        </svg>
      </div>

      <!-- 2. Header Backlight Glow -->
      <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[220px] h-[100px] bg-[#7c3aed]/20 blur-[25px] rounded-full pointer-events-none z-0"></div>

      <!-- Header Navigation & Month Display -->
      <div class="relative z-10 flex items-center justify-between mt-2">
        <!-- Previous Month Button -->
        <button onclick="changeMonth(-1)" class="w-9 h-9 rounded-full border border-white/[0.08] bg-white/[0.02] hover:bg-white/[0.08] active:scale-95 transition-all flex items-center justify-center text-white/80">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
          </svg>
        </button>

        <!-- Month & Year Title -->
        <span id="month-year-label" class="text-[16px] font-semibold text-white tracking-wide">June 2026</span>

        <!-- Next Month Button -->
        <button onclick="changeMonth(1)" class="w-9 h-9 rounded-full border border-white/[0.08] bg-white/[0.02] hover:bg-white/[0.08] active:scale-95 transition-all flex items-center justify-center text-white/80">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
          </svg>
        </button>
      </div>

      <!-- Static Weekdays Header Row -->
      <div class="relative z-10 grid grid-cols-7 text-center mt-5 mb-2">
        <span class="text-[10px] font-bold tracking-widest text-white/40">MON</span>
        <span class="text-[10px] font-bold tracking-widest text-white/40">TUE</span>
        <span class="text-[10px] font-bold tracking-widest text-white/40">WED</span>
        <span class="text-[10px] font-bold tracking-widest text-white/40">THU</span>
        <span class="text-[10px] font-bold tracking-widest text-white/40">FRI</span>
        <span class="text-[10px] font-bold tracking-widest text-white/40">SAT</span>
        <span class="text-[10px] font-bold tracking-widest text-white/40">SUN</span>
      </div>

      <!-- Dynamic Calendar Grid -->
      <div id="calendar-grid" class="fade-transition relative z-10 grid grid-cols-7 gap-y-1.5 text-center flex-1 items-center justify-items-center mb-2">
        <!-- Days injected dynamically -->
      </div>

    </div>
  </div>

  <script>
    // 1. Initialize State dynamically using live current date
    const today = new Date();
    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth(); // 0-indexed
    let selectedDay = today.getDate();

    const monthNames = [
      "January", "February", "March", "April", "May", "June", 
      "July", "August", "September", "October", "November", "December"
    ];

    const gridContainer = document.getElementById('calendar-grid');
    const monthYearLabel = document.getElementById('month-year-label');

    // 2. Calendar Grid Renderer
    function renderCalendar(year, month) {
      monthYearLabel.innerText = `${monthNames[month]} ${year}`;
      gridContainer.innerHTML = '';

      const firstDayIndex = new Date(year, month, 1).getDay();
      const adjustedStartDay = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;

      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();

      const totalCellsNeeded = adjustedStartDay + daysInMonth;
      const totalGridCells = totalCellsNeeded > 35 ? 42 : 35;

      // Render Padding Days from Previous Month
      for (let i = adjustedStartDay; i > 0; i--) {
        const prevDayVal = daysInPrevMonth - i + 1;
        const cell = document.createElement('div');
        cell.className = 'w-11 h-11 flex items-center justify-center text-sm font-medium text-white/20 cursor-pointer hover:text-white/40 transition-colors';
        cell.innerText = prevDayVal;
        cell.onclick = () => {
          changeMonth(-1);
          selectedDay = prevDayVal;
        };
        gridContainer.appendChild(cell);
      }

      // Render Active Days of Current Month
      for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement('div');
        cell.className = 'w-11 h-11 flex items-center justify-center relative group';

        const button = document.createElement('button');
        button.innerText = day;
        button.className = 'w-10 h-10 flex items-center justify-center text-sm rounded-full transition-all duration-200';

        if (day === selectedDay) {
          button.className += ' bg-[#704df3]/90 text-white font-semibold shadow-[0_0_15px_rgba(112,77,243,0.55)]';
        } else {
          button.className += ' text-white/90 hover:bg-white/[0.06] active:scale-95';
        }

        button.onclick = () => {
          selectedDay = day;
          renderCalendar(year, month);
        };

        cell.appendChild(button);
        gridContainer.appendChild(cell);
      }

      // Render Padding Days of Next Month
      const currentRenderCount = adjustedStartDay + daysInMonth;
      const trailingDaysCount = totalGridCells - currentRenderCount;

      for (let day = 1; day <= trailingDaysCount; day++) {
        const cell = document.createElement('div');
        cell.className = 'w-11 h-11 flex items-center justify-center text-sm font-medium text-white/20 cursor-pointer hover:text-white/40 transition-colors';
        cell.innerText = day;
        cell.onclick = () => {
          changeMonth(1);
          selectedDay = day;
        };
        gridContainer.appendChild(cell);
      }
    }

    // 3. Navigation Controller
    function changeMonth(direction) {
      gridContainer.style.opacity = '0';
      gridContainer.style.transform = 'scale(0.97)';

      setTimeout(() => {
        currentMonth += direction;
        if (currentMonth < 0) {
          currentMonth = 11;
          currentYear -= 1;
        } else if (currentMonth > 11) {
          currentMonth = 0;
          currentYear += 1;
        }

        const daysInTargetMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        if (selectedDay > daysInTargetMonth) {
          selectedDay = daysInTargetMonth;
        }

        renderCalendar(currentYear, currentMonth);

        gridContainer.style.opacity = '1';
        gridContainer.style.transform = 'scale(1)';
      }, 180);
    }

    // Initial render call
    renderCalendar(currentYear, currentMonth);
  </script>
</body>
</html>
