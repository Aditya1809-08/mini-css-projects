<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Glass Ticket Calendar</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f6f9;
      background-image: 
        linear-gradient(rgba(0, 198, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 198, 255, 0.015) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* Glass Panels */
    .glass-card {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .fade-transition {
      transition: opacity 0.2s ease-in-out, transform 0.2s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen w-screen flex items-center justify-center p-4 md:p-8 relative overflow-x-hidden">

  <!-- 1. Ambient Background Glows -->
  <div class="absolute top-[10%] right-[15%] w-[400px] h-[400px] rounded-full bg-purple-400/10 blur-[80px] pointer-events-none z-0"></div>
  <div class="absolute bottom-[15%] left-[10%] w-[500px] h-[500px] rounded-full bg-[#00c6ff]/10 blur-[90px] pointer-events-none z-0"></div>

  <!-- 2. Floating Glass Rings -->
  <div class="absolute top-[15%] left-[8%] w-32 h-32 rounded-full border border-white/40 bg-white/5 backdrop-blur-[3px] shadow-sm pointer-events-none z-0"></div>
  <div class="absolute bottom-[20%] right-[5%] w-48 h-48 rounded-full border border-white/30 bg-white/5 backdrop-blur-[2px] shadow-sm pointer-events-none z-0"></div>
  <div class="absolute top-[50%] right-[40%] w-20 h-20 rounded-full border border-white/40 bg-white/5 backdrop-blur-[4px] shadow-sm pointer-events-none z-0"></div>

  <!-- Main Container -->
  <div class="w-full max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-12 gap-8 items-center relative z-10 px-2">
    
    <!-- LEFT COLUMN: Ticket Pass and Header Styling (PC: 5 Cols, Mobile: Stacked) -->
    <div class="md:col-span-5 flex flex-col gap-6">
      
      <!-- Studio Header Accent -->
      <div class="flex items-center gap-4">
        <span class="text-xs font-bold tracking-[0.25em] text-[#00c6ff]">STUDIO K</span>
        <div class="flex-1 h-[1px] bg-gradient-to-r from-[#00c6ff]/60 to-transparent"></div>
      </div>

      <!-- Title Text (Matching exact reference typography layout) -->
      <h1 class="text-2xl md:text-3xl font-light text-slate-800 leading-tight">
        How I organize my <br>
        <span class="text-5xl md:text-6xl font-black tracking-tight bg-gradient-to-r from-[#5d3fe8] via-[#0ea5e9] to-[#00d2ff] bg-clip-text text-transparent block my-2">Schedule</span>
        through strategic planning.
      </h1>

      <!-- Dynamic Ticket Pass Widget -->
      <div class="relative glass-card w-full h-[220px] rounded-3xl p-6 shadow-xl shadow-slate-200/40 flex flex-col justify-between overflow-hidden">
        <!-- Ticket Bites (Cutout notches) -->
        <div class="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-1/2 w-6 h-6 rounded-full bg-[#f3f6f9] border-r border-white/60 shadow-inner z-10"></div>
        <div class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-1/2 w-6 h-6 rounded-full bg-[#f3f6f9] border-l border-white/60 shadow-inner z-10"></div>
        
        <!-- Perforation Line -->
        <div class="absolute left-6 right-6 top-1/2 -translate-y-1/2 border-t border-dashed border-slate-300/50 pointer-events-none"></div>

        <!-- Upper Half (Date Data) -->
        <div class="flex justify-between items-start z-10">
          <div>
            <span class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold block">Date Selected</span>
            <span id="ticket-day-name" class="text-xl font-bold text-slate-800">Tuesday</span>
            <span id="ticket-month-year" class="text-xs text-slate-400 block mt-0.5">June, 2026</span>
          </div>
          <div class="text-right">
            <span class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold block">Pass Code</span>
            <span id="ticket-day-number" class="text-4xl font-black text-[#5d3fe8] tracking-tight">16</span>
          </div>
        </div>

        <!-- Lower Half (Branding & Navigation) -->
        <div class="flex justify-between items-end z-10">
          <div>
            <span class="text-sm font-bold text-[#5d3fe8]">Interface UI</span>
            <span class="text-[9px] text-slate-400 block tracking-wider">Ticket de passagem</span>
            <!-- Custom Indicator dots -->
            <div class="flex gap-1 mt-2">
              <span class="w-1.5 h-1.5 rounded-full bg-[#00c6ff]"></span>
              <span class="w-1.5 h-1.5 rounded-full bg-[#00c6ff]"></span>
              <span class="w-1.5 h-1.5 rounded-full bg-[#00c6ff]"></span>
              <span class="w-1.5 h-1.5 rounded-full bg-slate-300"></span>
              <span class="w-1.5 h-1.5 rounded-full bg-slate-300"></span>
            </div>
          </div>

          <!-- Month Navigators nested directly on the Ticket -->
          <div class="flex gap-2">
            <button onclick="changeMonth(-1)" class="w-8 h-8 rounded-full border border-slate-300/40 bg-white/60 hover:bg-white active:scale-95 transition-all flex items-center justify-center text-slate-600 shadow-sm">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
              </svg>
            </button>
            <button onclick="changeMonth(1)" class="w-8 h-8 rounded-full border border-slate-300/40 bg-white/60 hover:bg-white active:scale-95 transition-all flex items-center justify-center text-slate-600 shadow-sm">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="hidden md:flex justify-between text-[11px] font-bold text-slate-400 tracking-[0.2em] uppercase mt-4 px-1">
        <span>Interface</span>
        <span>2026</span>
        <span>Jul</span>
      </div>
    </div>

    <!-- RIGHT COLUMN: Detailed Calendar Grid (PC: 7 Cols, Mobile: Stacked) -->
    <div class="md:col-span-7">
      <div class="glass-card w-full rounded-[32px] p-6 md:p-8 shadow-2xl shadow-slate-200/50 flex flex-col justify-between">
        
        <!-- Grid Header (Dynamic Month Indicator) -->
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-200/40">
          <span id="grid-month-label" class="text-xl md:text-2xl font-bold text-slate-800">June 2026</span>
          <span class="text-xs font-semibold text-[#00c6ff] tracking-wider uppercase bg-[#00c6ff]/10 px-3 py-1 rounded-full">Calendar View</span>
        </div>

        <!-- Weekdays Header Row -->
        <div class="grid grid-cols-7 text-center mb-4">
          <span class="text-[11px] font-bold tracking-widest text-slate-400">MON</span>
          <span class="text-[11px] font-bold tracking-widest text-slate-400">TUE</span>
          <span class="text-[11px] font-bold tracking-widest text-slate-400">WED</span>
          <span class="text-[11px] font-bold tracking-widest text-slate-400">THU</span>
          <span class="text-[11px] font-bold tracking-widest text-slate-400">FRI</span>
          <span class="text-[11px] font-bold tracking-widest text-slate-400">SAT</span>
          <span class="text-[11px] font-bold tracking-widest text-slate-400">SUN</span>
        </div>

        <!-- Dynamic Calendar Days Grid -->
        <div id="calendar-grid" class="fade-transition grid grid-cols-7 gap-x-2 gap-y-3 text-center justify-items-center">
          <!-- Injected dynamically by JS -->
        </div>

      </div>
    </div>

  </div>

  <script>
    // 1. Initialize State with Current Live Date
    const today = new Date();
    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth(); // 0-indexed
    let selectedDay = today.getDate();

    const monthNames = [
      "January", "February", "March", "April", "May", "June", 
      "July", "August", "September", "October", "November", "December"
    ];

    const weekdayNames = [
      "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"
    ];

    const gridContainer = document.getElementById('calendar-grid');
    const gridMonthLabel = document.getElementById('grid-month-label');
    
    // Ticket elements
    const ticketDayName = document.getElementById('ticket-day-name');
    const ticketMonthYear = document.getElementById('ticket-month-year');
    const ticketDayNumber = document.getElementById('ticket-day-number');

    // 2. Calendar Grid Renderer
    function renderCalendar(year, month) {
      // Update Grid Labels
      gridMonthLabel.innerText = `${monthNames[month]} ${year}`;
      
      // Clear previous grid items
      gridContainer.innerHTML = '';

      const firstDayIndex = new Date(year, month, 1).getDay();
      const adjustedStartDay = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;

      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();

      const totalCellsNeeded = adjustedStartDay + daysInMonth;
      const totalGridCells = totalCellsNeeded > 35 ? 42 : 35;

      // Render Padding Days from Previous Month
      for (let i = adjustedStartDay; i > 0; i--) {
        const prevDayVal = daysInPrevMonth - i + 1;
        const cell = document.createElement('div');
        cell.className = 'w-10 h-10 md:w-12 md:h-12 flex items-center justify-center text-sm font-medium text-slate-300 cursor-pointer hover:text-slate-400 transition-colors';
        cell.innerText = prevDayVal;
        cell.onclick = () => {
          changeMonth(-1);
          selectedDay = prevDayVal;
        };
        gridContainer.appendChild(cell);
      }

      // Render Active Days of Selected Month
      for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement('div');
        cell.className = 'w-10 h-10 md:w-12 md:h-12 flex items-center justify-center relative';

        const button = document.createElement('button');
        button.innerText = day;
        button.className = 'w-9 h-9 md:w-11 md:h-11 flex items-center justify-center text-[13px] md:text-sm font-semibold rounded-full transition-all duration-200';

        if (day === selectedDay) {
          // Sleek Indigo-to-Cyan Gradient to match heading typography
          button.className += ' bg-gradient-to-tr from-[#5d3fe8] to-[#00c6ff] text-white shadow-lg shadow-indigo-500/30';
        } else {
          button.className += ' text-slate-700 hover:bg-white active:scale-95 shadow-sm hover:shadow-md border border-transparent hover:border-slate-200/50';
        }

        button.onclick = () => {
          selectedDay = day;
          renderCalendar(year, month);
          updateTicket();
        };

        cell.appendChild(button);
        gridContainer.appendChild(cell);
      }

      // Render Padding Days of Next Month
      const currentRenderCount = adjustedStartDay + daysInMonth;
      const trailingDaysCount = totalGridCells - currentRenderCount;

      for (let day = 1; day <= trailingDaysCount; day++) {
        const cell = document.createElement('div');
        cell.className = 'w-10 h-10 md:w-12 md:h-12 flex items-center justify-center text-sm font-medium text-slate-300 cursor-pointer hover:text-slate-400 transition-colors';
        cell.innerText = day;
        cell.onclick = () => {
          changeMonth(1);
          selectedDay = day;
        };
        gridContainer.appendChild(cell);
      }

      updateTicket();
    }

    // 3. Update Left Ticket Panel dynamically
    function updateTicket() {
      const selectedDateObj = new Date(currentYear, currentMonth, selectedDay);
      
      ticketDayName.innerText = weekdayNames[selectedDateObj.getDay()];
      ticketMonthYear.innerText = `${monthNames[currentMonth]}, ${currentYear}`;
      ticketDayNumber.innerText = String(selectedDay).padStart(2, '0');
    }

    // 4. Navigation Controller
    function changeMonth(direction) {
      gridContainer.style.opacity = '0';
      gridContainer.style.transform = 'scale(0.98)';

      setTimeout(() => {
        currentMonth += direction;
        if (currentMonth < 0) {
          currentMonth = 11;
          currentYear -= 1;
        } else if (currentMonth > 11) {
          currentMonth = 0;
          currentYear += 1;
        }

        const daysInTargetMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        if (selectedDay > daysInTargetMonth) {
          selectedDay = daysInTargetMonth;
        }

        renderCalendar(currentYear, currentMonth);

        gridContainer.style.opacity = '1';
        gridContainer.style.transform = 'scale(1)';
      }, 180);
    }

    // Initial load call
    renderCalendar(currentYear, currentMonth);
  </script>
</body>
</html>
