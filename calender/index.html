<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>True Frosted Glass Calendar</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* ==========================================
         CHANGE YOUR BACKGROUND IMAGE URL HERE 
         ========================================== */
      --bg-image-url: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070&auto=format&fit=cover');
    }

    body {
      font-family: 'Inter', sans-serif;
      background-image: var(--bg-image-url);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Outer light-catching bevel edge wrapper */
    .glass-border-wrap {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.02) 100%);
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.4),
        0 10px 30px rgba(0, 0, 0, 0.2);
    }

    /* Premium dark frosted glass background */
    .glass-card-inner {
      background: rgba(18, 19, 23, 0.45);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }

    .fade-transition {
      transition: opacity 0.18s ease-in-out, transform 0.18s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen w-screen flex items-center justify-center p-4 overflow-hidden">

  <!-- Outer Glass Border Wrapper -->
  <div class="glass-border-wrap relative p-[1px] rounded-[32px]">
    
    <!-- Frosted Glass Card Panel -->
    <div class="glass-card-inner relative w-[370px] h-[390px] rounded-[31px] p-6 flex flex-col justify-between overflow-hidden select-none">
      
      <!-- Subtle top light-backlight glow (soft & blended) -->
      <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[200px] h-[70px] bg-[#8b5cf6]/15 blur-[25px] rounded-full pointer-events-none z-0"></div>

      <!-- Header Navigation & Month Display -->
      <div class="relative z-10 flex items-center justify-between mt-1 px-1">
        <!-- Previous Month Button -->
        <button onclick="changeMonth(-1)" class="w-8 h-8 rounded-full border border-white/[0.06] bg-white/[0.02] hover:bg-white/[0.08] active:scale-95 transition-all flex items-center justify-center text-white/70 hover:text-white">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
          </svg>
        </button>

        <!-- Month & Year Title -->
        <span id="month-year-label" class="text-[15px] font-semibold text-white/95 tracking-wide">June 2026</span>

        <!-- Next Month Button -->
        <button onclick="changeMonth(1)" class="w-8 h-8 rounded-full border border-white/[0.06] bg-white/[0.02] hover:bg-white/[0.08] active:scale-95 transition-all flex items-center justify-center text-white/70 hover:text-white">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
          </svg>
        </button>
      </div>

      <!-- Balanced Weekdays Header Row -->
      <div class="relative z-10 grid grid-cols-7 text-center mt-5 mb-1.5 px-0.5">
        <span class="text-[10px] font-bold tracking-widest text-white/40">MON</span>
        <span class="text-[10px] font-bold tracking-widest text-white/40">TUE</span>
        <span class="text-[10px] font-bold tracking-widest text-white/40">WED</span>
        <span class="text-[10px] font-bold tracking-widest text-white/40">THU</span>
        <span class="text-[10px] font-bold tracking-widest text-white/40">FRI</span>
        <span class="text-[10px] font-bold tracking-widest text-white/40">SAT</span>
        <span class="text-[10px] font-bold tracking-widest text-white/40">SUN</span>
      </div>

      <!-- Dynamic Calendar Grid -->
      <div id="calendar-grid" class="fade-transition relative z-10 grid grid-cols-7 gap-y-1 text-center flex-1 items-center justify-items-center mb-1.5 px-0.5">
        <!-- Days injected dynamically -->
      </div>

    </div>
  </div>

  <script>
    // 1. Initialize State dynamically using live current date
    const today = new Date();
    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth(); // 0-indexed
    let selectedDay = today.getDate();

    const monthNames = [
      "January", "February", "March", "April", "May", "June", 
      "July", "August", "September", "October", "November", "December"
    ];

    const gridContainer = document.getElementById('calendar-grid');
    const monthYearLabel = document.getElementById('month-year-label');

    // 2. Calendar Grid Renderer
    function renderCalendar(year, month) {
      monthYearLabel.innerText = `${monthNames[month]} ${year}`;
      gridContainer.innerHTML = '';

      const firstDayIndex = new Date(year, month, 1).getDay();
      const adjustedStartDay = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;

      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();

      const totalCellsNeeded = adjustedStartDay + daysInMonth;
      const totalGridCells = totalCellsNeeded > 35 ? 42 : 35;

      // Render Padding Days from Previous Month
      for (let i = adjustedStartDay; i > 0; i--) {
        const prevDayVal = daysInPrevMonth - i + 1;
        const cell = document.createElement('div');
        cell.className = 'w-11 h-11 flex items-center justify-center text-[14px] font-medium text-white/15 cursor-pointer hover:text-white/35 transition-colors';
        cell.innerText = prevDayVal;
        cell.onclick = () => {
          changeMonth(-1);
          selectedDay = prevDayVal;
        };
        gridContainer.appendChild(cell);
      }

      // Render Active Days of Current Month
      for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement('div');
        cell.className = 'w-11 h-11 flex items-center justify-center relative group';

        const button = document.createElement('button');
        button.innerText = day;
        button.className = 'w-9.5 h-9.5 flex items-center justify-center text-[14px] font-medium rounded-full transition-all duration-200';

        if (day === selectedDay) {
          button.className += ' bg-gradient-to-tr from-[#7c3aed] to-[#a855f7] text-white font-semibold shadow-[0_4px_12px_rgba(124,58,237,0.35)]';
        } else {
          button.className += ' text-white/85 hover:bg-white/[0.07] active:scale-95';
        }

        button.onclick = () => {
          selectedDay = day;
          renderCalendar(year, month);
        };

        cell.appendChild(button);
        gridContainer.appendChild(cell);
      }

      // Render Padding Days of Next Month
      const currentRenderCount = adjustedStartDay + daysInMonth;
      const trailingDaysCount = totalGridCells - currentRenderCount;

      for (let day = 1; day <= trailingDaysCount; day++) {
        const cell = document.createElement('div');
        cell.className = 'w-11 h-11 flex items-center justify-center text-[14px] font-medium text-white/15 cursor-pointer hover:text-white/35 transition-colors';
        cell.innerText = day;
        cell.onclick = () => {
          changeMonth(1);
          selectedDay = day;
        };
        gridContainer.appendChild(cell);
      }
    }

    // 3. Navigation Controller
    function changeMonth(direction) {
      gridContainer.style.opacity = '0';
      gridContainer.style.transform = 'scale(0.98)';

      setTimeout(() => {
        currentMonth += direction;
        if (currentMonth < 0) {
          currentMonth = 11;
          currentYear -= 1;
        } else if (currentMonth > 11) {
          currentMonth = 0;
          currentYear += 1;
        }

        const daysInTargetMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        if (selectedDay > daysInTargetMonth) {
          selectedDay = daysInTargetMonth;
        }

        renderCalendar(currentYear, currentMonth);

        gridContainer.style.opacity = '1';
        gridContainer.style.transform = 'scale(1)';
      }, 180);
    }

    // Initial render call
    renderCalendar(currentYear, currentMonth);
  </script>
</body>
</html>
