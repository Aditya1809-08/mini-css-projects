<!DOCTYPE html>
<html lang="en">eeee
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Dashboard - Glass Neon Edition</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #03040b;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.015) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* Highly refined dark neon glass panels */
    .neon-glass {
      background: rgba(8, 12, 28, 0.65);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(0, 240, 255, 0.35);
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.8),
        0 0 15px rgba(6, 182, 212, 0.15),
        inset 0 1px 1px rgba(255, 255, 255, 0.08);
    }

    .fade-transition {
      transition: opacity 0.18s ease-in-out, transform 0.18s ease-in-out;
    }

    #task-list::-webkit-scrollbar {
      width: 4px;
    }
    #task-list::-webkit-scrollbar-track {
      background: transparent;
    }
    #task-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
    #task-list::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body class="min-h-screen w-screen flex items-center justify-center p-4 sm:p-6 md:p-10 lg:p-12 overflow-x-hidden relative">

  <!-- local glowing backgrounds (matched with card placements) -->
  <div class="absolute top-[20%] left-[10%] w-[400px] h-[400px] rounded-full bg-[#00f0ff]/10 blur-[100px] pointer-events-none z-0"></div>
  <div class="absolute bottom-[20%] right-[10%] w-[500px] h-[500px] rounded-full bg-blue-600/10 blur-[110px] pointer-events-none z-0"></div>

  <!-- Main Grid Wrapper -->
  <div class="w-full max-w-[1200px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-stretch relative z-10">
    
    <!-- LEFT COLUMN: Greeting, Clock, Progress & Tasks (PC: 5 Cols, Mobile: Stacked) -->
    <div class="lg:col-span-5 flex flex-col gap-6 lg:gap-8 justify-between">
      
      <!-- Greeting and Live Clock Panel -->
      <div class="neon-glass rounded-[32px] p-6 lg:p-8 flex flex-col justify-between shadow-2xl relative overflow-hidden">
        <div class="flex flex-col gap-1">
          <span class="text-[10px] font-bold tracking-[0.2em] text-[#00f0ff] uppercase">System Dashboard</span>
          <h2 id="live-greeting" class="text-3xl font-black text-white tracking-tight">Good Night</h2>
          <span id="live-date" class="text-xs font-semibold text-slate-400">Wednesday, June 17, 2026</span>
        </div>
        
        <!-- Large Clock -->
        <div class="mt-8 pt-5 border-t border-white/5 flex items-baseline justify-between">
          <div id="live-clock" class="text-3xl sm:text-4xl lg:text-5xl font-black text-white tracking-tight">12:53:00</div>
          <span id="clock-ampm" class="text-sm font-bold text-[#00f0ff] uppercase tracking-widest">PM</span>
        </div>
      </div>

      <!-- Month Progress Tracker (Copied from System Update mockup design) -->
      <div class="neon-glass rounded-[32px] p-6 lg:p-8 shadow-2xl">
        <div class="flex flex-col gap-4">
          <div class="flex flex-col gap-1">
            <span class="text-[9px] font-bold tracking-[0.2em] text-slate-400 uppercase">Cycle Progression</span>
            <h3 class="text-xl font-bold text-white tracking-tight">Month Progress</h3>
          </div>

          <!-- Cyan to Royal Blue gradient bar -->
          <div class="w-full h-3 bg-white/5 rounded-full overflow-hidden border border-white/5 relative">
            <div id="progress-bar-fill" class="h-full bg-gradient-to-r from-[#00f0ff] to-[#3b82f6] rounded-full transition-all duration-1000" style="width: 0%"></div>
          </div>

          <div class="flex justify-between items-center text-xs">
            <span class="text-slate-400 font-medium">Completed days</span>
            <span id="progress-percent-label" class="font-bold text-white tracking-wide">00.00%</span>
          </div>
        </div>
      </div>

      <!-- Interactive Task Manager -->
      <div class="neon-glass rounded-[32px] p-6 flex flex-col justify-between shadow-xl flex-1 min-h-[250px]">
        <div class="flex flex-col gap-4 h-full justify-between">
          <div>
            <span class="text-[9px] font-bold tracking-[0.2em] text-slate-400 uppercase block mb-3">Tasks in Memory</span>
            <!-- Tasks List Container -->
            <div id="task-list" class="space-y-2 max-h-[140px] overflow-y-auto pr-1">
              <!-- Injected dynamically -->
            </div>
          </div>

          <!-- Custom Pill Task Input Form -->
          <form id="task-form" onsubmit="addTask(event)" class="flex gap-3 items-center mt-4 pt-3 border-t border-white/5">
            <input type="text" id="task-input" placeholder="Add custom action..." required
              class="flex-1 bg-white/5 hover:bg-white/10 focus:bg-white/15 text-xs text-white placeholder-white/20 border border-white/5 focus:border-[#00f0ff]/50 outline-none rounded-xl px-3 py-3 transition-all" />
            <button type="submit" class="bg-white hover:bg-slate-100 text-[#03040b] font-extrabold text-xs px-5 py-3 rounded-full transition-all shadow-md shadow-white/5">
              Add Task
            </button>
          </form>
        </div>
      </div>

    </div>

    <!-- RIGHT COLUMN: Large Glowing Calendar Panel (PC: 7 Cols, Mobile: Stacked) -->
    <div class="lg:col-span-7 w-full">
      <div class="neon-glass w-full h-full rounded-[36px] sm:rounded-[48px] p-6 sm:p-10 flex flex-col justify-between shadow-2xl">
        
        <!-- Header Controls -->
        <div class="flex justify-between items-center pb-5 border-b border-white/5">
          <!-- Previous Month -->
          <button onclick="changeMonth(-1)" class="w-9 h-9 rounded-full border border-white/10 bg-white/5 hover:bg-white/10 active:scale-95 transition-all flex items-center justify-center text-white">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
            </svg>
          </button>

          <!-- Dynamic Month label -->
          <span id="month-year-label" class="text-lg sm:text-2xl font-bold text-white tracking-wide">June 2026</span>

          <!-- Next Month -->
          <button onclick="changeMonth(1)" class="w-9 h-9 rounded-full border border-white/10 bg-white/5 hover:bg-white/10 active:scale-95 transition-all flex items-center justify-center text-white">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
          </button>
        </div>

        <!-- Weekdays row -->
        <div class="grid grid-cols-7 text-center mt-6 mb-4">
          <span class="text-[10px] sm:text-xs font-bold tracking-widest text-slate-500">MON</span>
          <span class="text-[10px] sm:text-xs font-bold tracking-widest text-slate-500">TUE</span>
          <span class="text-[10px] sm:text-xs font-bold tracking-widest text-slate-500">WED</span>
          <span class="text-[10px] sm:text-xs font-bold tracking-widest text-slate-500">THU</span>
          <span class="text-[10px] sm:text-xs font-bold tracking-widest text-slate-500">FRI</span>
          <span class="text-[10px] sm:text-xs font-bold tracking-widest text-slate-500">SAT</span>
          <span class="text-[10px] sm:text-xs font-bold tracking-widest text-slate-500">SUN</span>
        </div>

        <!-- Calendar Days grid (PC: Large touch targets, Mobile: Scaled) -->
        <div id="calendar-grid" class="fade-transition grid grid-cols-7 gap-y-1.5 sm:gap-y-2.5 text-center flex-1 items-center justify-items-center">
          <!-- Injected dynamically -->
        </div>

      </div>
    </div>

  </div>

  <script>
    // 1. Get Live Dynamic System Date
    const today = new Date();
    const realCurrentYear = today.getFullYear();
    const realCurrentMonth = today.getMonth(); // 0-indexed
    const realCurrentDay = today.getDate();

    // Calendar view state variables
    let viewYear = realCurrentYear;
    let viewMonth = realCurrentMonth;

    const monthNames = [
      "January", "February", "March", "April", "May", "June", 
      "July", "August", "September", "October", "November", "December"
    ];

    const weekdayNames = [
      "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"
    ];

    const gridContainer = document.getElementById('calendar-grid');
    const monthYearLabel = document.getElementById('month-year-label');

    // 2. Calendar Renderer (Highlighting *only* today's present date)
    function renderCalendar(year, month) {
      monthYearLabel.innerText = `${monthNames[month]} ${year}`;
      gridContainer.innerHTML = '';

      const firstDayIndex = new Date(year, month, 1).getDay();
      const adjustedStartDay = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;

      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();

      const totalCellsNeeded = adjustedStartDay + daysInMonth;
      const totalGridCells = totalCellsNeeded > 35 ? 42 : 35;

      // Render Previous Month Padding Days
      for (let i = adjustedStartDay; i > 0; i--) {
        const prevDayVal = daysInPrevMonth - i + 1;
        const cell = document.createElement('div');
        cell.className = 'w-9 h-9 sm:w-12 sm:h-12 flex items-center justify-center text-xs sm:text-base font-medium text-slate-800';
        cell.innerText = prevDayVal;
        gridContainer.appendChild(cell);
      }

      // Render Active Days of Selected Month
      for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement('div');
        cell.className = 'w-9 h-9 sm:w-12 sm:h-12 flex items-center justify-center relative';

        const daySpan = document.createElement('span');
        daySpan.innerText = day;
        daySpan.className = 'w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center text-xs sm:text-base font-medium rounded-full';

        // Check if day is today (Present Day of Present Month)
        const isToday = (year === realCurrentYear && month === realCurrentMonth && day === realCurrentDay);

        if (isToday) {
          // Vibrant cyan highlight glowing target matching mockup design
          daySpan.className += ' bg-gradient-to-tr from-[#00f0ff] to-[#3b82f6] text-[#03040b] font-bold shadow-[0_0_15px_rgba(0,240,255,0.6)]';
        } else {
          daySpan.className += ' text-white/80';
        }

        cell.appendChild(daySpan);
        gridContainer.appendChild(cell);
      }

      // Render Next Month Padding Days
      const currentRenderCount = adjustedStartDay + daysInMonth;
      const trailingDaysCount = totalGridCells - currentRenderCount;

      for (let day = 1; day <= trailingDaysCount; day++) {
        const cell = document.createElement('div');
        cell.className = 'w-9 h-9 sm:w-12 sm:h-12 flex items-center justify-center text-xs sm:text-base font-medium text-slate-800';
        cell.innerText = day;
        gridContainer.appendChild(cell);
      }
    }

    // 3. Navigation Controls
    function changeMonth(direction) {
      gridContainer.style.opacity = '0';
      gridContainer.style.transform = 'scale(0.99)';

      setTimeout(() => {
        viewMonth += direction;
        if (viewMonth < 0) {
          viewMonth = 11;
          viewYear -= 1;
        } else if (viewMonth > 11) {
          viewMonth = 0;
          viewYear += 1;
        }

        renderCalendar(viewYear, viewMonth);

        gridContainer.style.opacity = '1';
        gridContainer.style.transform = 'scale(1)';
      }, 180);
    }

    // 4. Clock and Dynamic Greeting Logic
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      
      // Update Greeting
      let greeting = "Good Night";
      if (hours >= 5 && hours < 12) greeting = "Good Morning";
      else if (hours >= 12 && hours < 17) greeting = "Good Afternoon";
      else if (hours >= 17 && hours < 21) greeting = "Good Evening";

      // Convert to 12h format
      hours = hours % 12;
      hours = hours ? hours : 12;
      const formattedHours = String(hours).padStart(2, '0');

      document.getElementById('live-greeting').innerText = greeting;
      document.getElementById('live-clock').innerText = `${formattedHours}:${minutes}:${seconds}`;
      document.getElementById('clock-ampm').innerText = ampm;
      document.getElementById('live-date').innerText = `${weekdayNames[now.getDay()]}, ${monthNames[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
    }

    // 5. Dynamic Month Progress calculation (Vibrant cyan update bar)
    function updateMonthProgress() {
      const now = new Date();
      const totalDaysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      const currentDayVal = now.getDate();
      
      const percentage = ((currentDayVal / totalDaysInMonth) * 100).toFixed(2);
      
      document.getElementById('progress-bar-fill').style.width = `${percentage}%`;
      document.getElementById('progress-percent-label').innerText = `${percentage}%`;
    }

    // 6. Interactive Task Manager Logic
    let focusTasks = JSON.parse(localStorage.getItem('neon_focus_tasks')) || [
      { text: "Complete interface designs 🎨", completed: false },
      { text: "Backup local server cycle 💾", completed: true }
    ];

    const taskList = document.getElementById('task-list');
    const taskInput = document.getElementById('task-input');

    function renderTasks() {
      taskList.innerHTML = '';
      if (focusTasks.length === 0) {
        taskList.innerHTML = `<div class="text-slate-400/40 text-xs italic py-4">Task memory empty.</div>`;
        return;
      }

      focusTasks.forEach((task, index) => {
        const item = document.createElement('div');
        item.className = "flex items-center justify-between bg-white/5 hover:bg-white/10 rounded-xl px-3 py-2.5 transition-all border border-white/5";
        
        item.innerHTML = `
          <div class="flex items-center gap-2.5 truncate max-w-[85%]">
            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})"
              class="w-3.5 h-3.5 accent-[#00f0ff] cursor-pointer" />
            <span class="text-xs text-white/80 truncate ${task.completed ? 'line-through text-slate-500' : ''}">${task.text}</span>
          </div>
          <button onclick="deleteTask(${index})" class="text-slate-500 hover:text-red-500 transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          </button>
        `;
        taskList.appendChild(item);
      });
    }

    function addTask(e) {
      e.preventDefault();
      const text = taskInput.value.trim();
      if (!text) return;
      focusTasks.push({ text, completed: false });
      localStorage.setItem('neon_focus_tasks', JSON.stringify(focusTasks));
      taskInput.value = '';
      renderTasks();
    }

    function toggleTask(index) {
      focusTasks[index].completed = !focusTasks[index].completed;
      localStorage.setItem('neon_focus_tasks', JSON.stringify(focusTasks));
      renderTasks();
    }

    function deleteTask(index) {
      focusTasks.splice(index, 1);
      localStorage.setItem('neon_focus_tasks', JSON.stringify(focusTasks));
      renderTasks();
    }

    // Startup Loops
    renderCalendar(viewYear, viewMonth);
    renderTasks();
    setInterval(updateClock, 1000);
    updateClock(); // Run clock immediately
    updateMonthProgress(); // Run progress indicator immediately
  </script>
</body>
</html>
