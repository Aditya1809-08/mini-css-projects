<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculator — Aditya Srivastav</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
    }

    .bg-img {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: 0;
    }

    .bg-overlay {
      position: fixed; inset: 0; z-index: 1;
      background: rgba(0,0,0,0.2);
    }

    /* LAYOUT — 3 columns */
    .layout {
      position: relative; z-index: 10;
      display: grid;
      grid-template-columns: 280px 480px 280px;
      gap: 28px;
      align-items: center;
      padding: 20px;
    }

    /* WOOD PANEL */
    .wood-panel {
      background: linear-gradient(160deg, rgba(90,55,25,0.88), rgba(120,78,35,0.88));
      border: 3px solid rgba(155,105,55,0.95);
      border-radius: 22px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    /* HISTORY */
    .history-panel {
      padding: 24px 20px;
      height: 620px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .panel-title {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 14px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      overflow-y: auto;
    }

    .history-list::-webkit-scrollbar { width: 3px; }
    .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

    .history-item {
      font-size: 16px;
      font-weight: 500;
      color: rgba(255,255,255,0.85);
      padding: 6px 0;
    }

    .history-empty {
      font-size: 14px;
      color: rgba(255,255,255,0.35);
      font-style: italic;
    }

    /* CALCULATOR */
    .calc {
      background: linear-gradient(160deg, rgba(90,55,25,0.92), rgba(120,78,35,0.92));
      border: 5px solid rgba(155,105,55,0.98);
      border-radius: 32px;
      overflow: hidden;
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 70px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    /* DISPLAY */
    .display {
      background: rgba(160,190,182,0.3);
      backdrop-filter: blur(24px);
      padding: 32px 32px 24px;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      border-bottom: 2px solid rgba(155,105,55,0.5);
    }

    .display-expr {
      font-size: 16px;
      color: rgba(255,255,255,0.5);
      font-weight: 400;
      min-height: 24px;
      margin-bottom: 4px;
    }

    .display-main {
      font-size: 64px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1;
      word-break: break-all;
      text-align: right;
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    }

    /* KEYPAD */
    .keypad {
      background: rgba(140,175,168,0.5);
      padding: 22px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    /* BUTTON */
    .btn {
      font-family: 'Inter', sans-serif;
      font-size: 20px;
      font-weight: 600;
      padding: 24px 8px;
      background: rgba(140,175,168,0.75);
      border: 2.5px solid rgba(90,55,25,0.55);
      border-radius: 16px;
      cursor: pointer;
      color: #fff;
      box-shadow: 0 5px 0 rgba(90,55,25,0.65), 0 8px 14px rgba(0,0,0,0.25);
      transition: transform 0.08s, box-shadow 0.08s;
      user-select: none;
      line-height: 1;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.35);
    }

    .btn:hover { background: rgba(160,195,188,0.85); }
    .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(90,55,25,0.65); }

    /* OPERATOR */
    .btn-op {
      background: rgba(225,205,183,0.8);
      color: #2a1505;
      text-shadow: none;
      border-color: rgba(90,55,25,0.4);
    }
    .btn-op:hover { background: rgba(240,220,198,0.9); }

    /* CLEAR */
    .btn-clear {
      background: rgba(215,90,90,0.85);
      color: white;
      border-color: rgba(140,40,40,0.55);
      box-shadow: 0 5px 0 rgba(140,40,40,0.65), 0 8px 14px rgba(0,0,0,0.25);
    }
    .btn-clear:hover { background: rgba(230,105,105,0.9); }
    .btn-clear:active { box-shadow: 0 1px 0 rgba(140,40,40,0.65); }

    /* EQUALS */
    .btn-eq {
      background: rgba(40,40,40,0.88);
      color: white;
      grid-column: span 2;
      font-size: 16px;
      letter-spacing: 0.06em;
      box-shadow: 0 5px 0 rgba(10,10,10,0.85), 0 8px 14px rgba(0,0,0,0.3);
      border-color: rgba(80,80,80,0.4);
      text-shadow: none;
    }
    .btn-eq:hover { background: rgba(60,60,60,0.9); }
    .btn-eq:active { box-shadow: 0 1px 0 rgba(10,10,10,0.85); }

    /* CONVERSIONS */
    .conversions-panel {
      padding: 24px 20px;
      height: 620px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .conv-btn {
      width: 100%;
      padding: 18px 16px;
      background: rgba(255,255,255,0.1);
      border: 1.5px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      text-align: center;
      backdrop-filter: blur(4px);
      transition: all 0.2s;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
    }

    .conv-btn:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.35); }
    .conv-btn.active { background: rgba(255,255,255,0.28); border-color: rgba(255,255,255,0.55); }

    .conv-result {
      font-size: 14px;
      color: rgba(255,255,255,0.75);
      text-align: center;
      min-height: 20px;
      margin-top: 4px;
      font-weight: 600;
    }

    /* BACK */
    .back-wrap {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%); z-index: 20;
    }
    .back-link {
      font-size: 13px; font-weight: 500;
      color: rgba(255,255,255,0.55); text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: white; }

    @media (max-width: 1100px) {
      .layout { grid-template-columns: 1fr; }
      .history-panel, .conversions-panel { display: none; }
    }
  </style>
</head>
<body>

  <img class="bg-img" src="f17f48448b00ee31ba98f4340514c90c.jpg" alt="bg"/>
  <div class="bg-overlay"></div>

  <div class="layout">

    <!-- HISTORY -->
    <div class="wood-panel history-panel">
      <div class="panel-title">Recent History</div>
      <div class="history-list" id="historyList">
        <div class="history-empty">No calculations yet...</div>
      </div>
    </div>

    <!-- CALCULATOR -->
    <div class="calc">
      <div class="display">
        <div class="display-expr" id="expr"></div>
        <div class="display-main" id="display">0</div>
      </div>
      <div class="keypad">
        <button class="btn btn-clear" onclick="clearAll()">AC</button>
        <button class="btn btn-op" onclick="deleteLast()">DEL</button>
        <button class="btn btn-op" onclick="appendToDisplay('%')">%</button>
        <button class="btn btn-op" onclick="appendToDisplay('/')">÷</button>

        <button class="btn" onclick="appendToDisplay('1')">1</button>
        <button class="btn" onclick="appendToDisplay('2')">2</button>
        <button class="btn" onclick="appendToDisplay('3')">3</button>
        <button class="btn btn-op" onclick="appendToDisplay('*')">×</button>

        <button class="btn" onclick="appendToDisplay('4')">4</button>
        <button class="btn" onclick="appendToDisplay('5')">5</button>
        <button class="btn" onclick="appendToDisplay('6')">6</button>
        <button class="btn btn-op" onclick="appendToDisplay('+')">+</button>

        <button class="btn" onclick="appendToDisplay('7')">7</button>
        <button class="btn" onclick="appendToDisplay('8')">8</button>
        <button class="btn" onclick="appendToDisplay('9')">9</button>
        <button class="btn btn-op" onclick="appendToDisplay('-')">−</button>

        <button class="btn btn-eq" onclick="calculate()">RESULT</button>
        <button class="btn" onclick="appendToDisplay('0')">0</button>
        <button class="btn btn-op" onclick="appendToDisplay('.')">.</button>
      </div>
    </div>

    <!-- CONVERSIONS -->
    <div class="wood-panel conversions-panel">
      <div class="panel-title">Quick Conversions</div>
      <button class="conv-btn" onclick="convert('usd-eur', event)">USD to EUR</button>
      <button class="conv-btn" onclick="convert('cm-inch', event)">CM to INCH</button>
      <button class="conv-btn" onclick="convert('inch-cm', event)">INCH to CM</button>
      <button class="conv-btn" onclick="convert('kg-lb', event)">KG to LB</button>
      <button class="conv-btn" onclick="convert('c-f', event)">°C to °F</button>
      <div class="conv-result" id="convResult"></div>
    </div>

  </div>

  <div class="back-wrap">
    <a href="../" class="back-link">← Back to Projects</a>
  </div>

  <script>
    let currentInput = '';
    let expression = '';
    let justCalculated = false;
    const display = document.getElementById('display');
    const exprEl = document.getElementById('expr');
    const historyList = document.getElementById('historyList');
    const convResult = document.getElementById('convResult');
    let history = [];

    function updateDisplay(val) { display.textContent = val || '0'; }

    function addHistory(expr, result) {
      history.unshift(expr + ' = ' + result);
      if (history.length > 10) history.pop();
      historyList.innerHTML = history.map(h =>
        `<div class="history-item">${h}</div>`
      ).join('');
    }

    function appendToDisplay(val) {
      const ops = ['+','-','*','/'];
      if (justCalculated) {
        if (ops.includes(val)) { expression = currentInput + val; exprEl.textContent = expression; currentInput = ''; }
        else { currentInput = val; expression = ''; exprEl.textContent = ''; }
        justCalculated = false;
        updateDisplay(currentInput || val);
        return;
      }
      if (ops.includes(val) && ops.includes(currentInput.slice(-1))) {
        currentInput = currentInput.slice(0,-1) + val;
        expression = currentInput; exprEl.textContent = expression;
        updateDisplay(val); return;
      }
      if (val === '.') {
        const parts = currentInput.split(/[\+\-\*\/]/);
        if (parts[parts.length-1].includes('.')) return;
      }
      currentInput += val;
      if (ops.includes(val)) { expression = currentInput; exprEl.textContent = expression; updateDisplay(val); }
      else { const parts = currentInput.split(/(?<=[\+\-\*\/])/); updateDisplay(parts[parts.length-1]||'0'); exprEl.textContent = expression; }
    }

    function clearAll() { currentInput=''; expression=''; justCalculated=false; updateDisplay('0'); exprEl.textContent=''; }

    function deleteLast() {
      if (justCalculated) { clearAll(); return; }
      currentInput = currentInput.slice(0,-1);
      const parts = currentInput.split(/(?<=[\+\-\*\/])/);
      updateDisplay(parts[parts.length-1]||'0');
    }

    function calculate() {
      if (!currentInput) return;
      try {
        const expr = currentInput;
        expression = currentInput + ' ='; exprEl.textContent = expression;
        let result = Function('"use strict"; return ('+currentInput.replace(/%/g,'/100')+')')();
        result = parseFloat(result.toFixed(10));
        if (isNaN(result)||!isFinite(result)) { updateDisplay('ERROR'); currentInput=''; }
        else { updateDisplay(result); addHistory(expr, result); currentInput=String(result); }
        justCalculated = true;
      } catch { updateDisplay('ERROR'); currentInput=''; exprEl.textContent='SYNTAX ERROR'; justCalculated=true; }
    }

    function convert(type, e) {
      const val = parseFloat(currentInput || display.textContent);
      if (isNaN(val)) { convResult.textContent = 'Enter a number first!'; return; }
      let label;
      switch(type) {
        case 'usd-eur': label = `${val} USD = ${(val*0.92).toFixed(2)} EUR`; break;
        case 'cm-inch': label = `${val} cm = ${(val/2.54).toFixed(2)} in`; break;
        case 'inch-cm': label = `${val} in = ${(val*2.54).toFixed(2)} cm`; break;
        case 'kg-lb':   label = `${val} kg = ${(val*2.205).toFixed(2)} lb`; break;
        case 'c-f':     label = `${val}°C = ${((val*9/5)+32).toFixed(2)}°F`; break;
      }
      convResult.textContent = label;
      document.querySelectorAll('.conv-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
    }

    document.addEventListener('keydown',(e)=>{
      if(e.key>='0'&&e.key<='9') appendToDisplay(e.key);
      else if(e.key==='+') appendToDisplay('+');
      else if(e.key==='-') appendToDisplay('-');
      else if(e.key==='*') appendToDisplay('*');
      else if(e.key==='/'){e.preventDefault();appendToDisplay('/');}
      else if(e.key==='%') appendToDisplay('%');
      else if(e.key==='.') appendToDisplay('.');
      else if(e.key==='Enter'||e.key==='=') calculate();
      else if(e.key==='Backspace') deleteLast();
      else if(e.key==='Escape') clearAll();
    });
  </script>

</body>
</html>
