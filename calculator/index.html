<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Themeable Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #dbe6f2; /* Soft pastel blue background */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 30px 20px;
            transition: background-color 0.3s ease;
        }

        /* Top Theme Toggle Controls */
        .controls {
            margin-bottom: 20px;
            z-index: 10;
        }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #3b4b5a;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(15, 35, 60, 0.05);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toggle-btn:hover {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.85);
        }

        /* Composition Wrapper */
        .artboard {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            padding: 20px 0;
        }

        /* Blue Backdrop Circle (Perfect absolute centering) */
        .backdrop-circle {
            position: absolute;
            width: 440px;
            height: 440px;
            background-color: #1073e5; /* Exact vibrant blue from the image */
            border-radius: 50%;
            z-index: 1;
            box-shadow: 0 15px 45px rgba(16, 115, 229, 0.25);
            pointer-events: none;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.3s ease, height 0.3s ease;
        }

        /* Calculator Card container */
        .calculator-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ==========================================
           COMMON CALCULATOR CARD STYLES
           ========================================== */
        .calc-card {
            width: 320px;
            height: 570px;
            border-radius: 40px;
            padding: 30px 24px 24px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.3s ease;
            animation: fadeIn 0.35s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Display Panel styling */
        .display {
            text-align: right;
            padding: 10px;
            margin-bottom: 10px;
        }

        .expression {
            font-size: 1.15rem;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            min-height: 1.5rem;
            font-weight: 400;
        }

        .result {
            font-size: 2.3rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            min-height: 3.2rem;
        }

        /* Keypad Grid layout */
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        /* Individual Button styling */
        .btn {
            aspect-ratio: 1;
            border: none;
            border-radius: 18px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Elongated pill button shape */
        .btn.pill {
            border-radius: 24px;
        }

        /* Accent Blue Button (Common) */
        .btn.accent-blue {
            background: linear-gradient(180deg, #1d82f5 0%, #116cd6 100%);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(17, 108, 214, 0.35);
        }

        /* ==========================================
           LEFT (LIGHT THEME) STYLING
           ========================================== */
        .calc-light {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.75) 0%, rgba(222, 236, 248, 0.75) 100%);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 30px 60px rgba(15, 35, 60, 0.12);
        }

        .calc-light .expression {
            color: rgba(29, 45, 58, 0.65);
        }

        .calc-light .result {
            color: #1d2d3a;
        }

        .calc-light .btn {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(235, 242, 248, 0.85) 100%);
            color: #7a8c9e;
            box-shadow: 
                -2px -2px 6px rgba(255, 255, 255, 0.9),
                2px 2px 8px rgba(160, 185, 210, 0.25);
        }

        .calc-light .btn.num {
            color: #506275;
        }

        /* ==========================================
           RIGHT (DARK THEME) STYLING
           ========================================== */
        .calc-dark {
            background: linear-gradient(135deg, #1b2129 0%, #0e1216 100%);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .calc-dark .expression {
            color: #7a8c9e;
        }

        .calc-dark .result {
            color: #ffffff;
        }

        .calc-dark .btn {
            background: linear-gradient(135deg, #232a33 0%, #171d24 100%);
            color: #8fa0b0;
            box-shadow: 
                -2px -2px 6px rgba(255, 255, 255, 0.02),
                2px 2px 8px rgba(0, 0, 0, 0.45);
        }

        .calc-dark .btn.num {
            color: #cfd8dc;
        }

        /* ==========================================
           TOGGLE VISIBILITY CONTROLS
           ========================================== */
        body[data-active-theme="light"] .calc-dark {
            display: none !important;
        }

        body[data-active-theme="dark"] .calc-light {
            display: none !important;
        }

        /* ==========================================
           RESPONSIVE SMALL SCREEN MEDIA QUERY
           ========================================== */
        @media (max-width: 480px) {
            .backdrop-circle {
                width: 320px;
                height: 320px;
            }
            .calc-card {
                width: 290px;
                height: 520px;
                padding: 24px 18px 18px 18px;
                border-radius: 32px;
            }
            .result {
                font-size: 2rem;
                min-height: 2.8rem;
            }
            .keypad {
                gap: 8px;
            }
            .btn {
                border-radius: 14px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body data-active-theme="light">

    <!-- Top Theme Switch Control -->
    <div class="controls">
        <button class="toggle-btn" onclick="toggleTheme()" id="toggle-text">
            Switch to Dark Theme 🌙
        </button>
    </div>

    <div class="artboard">
        <!-- Vibrant blue background circle -->
        <div class="backdrop-circle"></div>

        <div class="calculator-wrapper">
            
            <!-- ==========================================
                 LIGHT THEME CALCULATOR
                 ========================================== -->
            <div class="calc-card calc-light" id="calc-light">
                <div class="display">
                    <div class="expression" id="light-expr"></div>
                    <div class="result" id="light-res">0</div>
                </div>
                <div class="keypad">
                    <!-- Row 1 -->
                    <button class="btn" onclick="pressLight('Ac')">Ac</button>
                    <button class="btn" onclick="pressLight('±')">±</button>
                    <button class="btn" onclick="pressLight('%')">%</button>
                    <button class="btn" onclick="pressLight('%')">%</button>
                    
                    <!-- Row 2 -->
                    <button class="btn" onclick="pressLight('Ac')">Ac</button>
                    <button class="btn num" onclick="pressLight('8')">8</button>
                    <button class="btn num" onclick="pressLight('9')">9</button>
                    <button class="btn" onclick="pressLight('/')">÷</button>
                    
                    <!-- Row 3 -->
                    <button class="btn num" onclick="pressLight('4')">4</button>
                    <button class="btn num" onclick="pressLight('5')">5</button>
                    <button class="btn num" onclick="pressLight('6')">6</button>
                    <button class="btn" onclick="pressLight('*')">×</button>
                    
                    <!-- Row 4 -->
                    <button class="btn num" onclick="pressLight('1')">1</button>
                    <button class="btn num" onclick="pressLight('2')">2</button>
                    <button class="btn num" onclick="pressLight('3')">3</button>
                    <button class="btn" onclick="pressLight('-')">−</button>
                    
                    <!-- Row 5 -->
                    <button class="btn num" onclick="pressLight('0')">0</button>
                    <button class="btn" onclick="pressLight('.')">.</button>
                    <button class="btn" onclick="pressLight('+')">+</button>
                    <button class="btn accent-blue pill" onclick="pressLight('=')">=</button>
                </div>
            </div>

            <!-- ==========================================
                 DARK THEME CALCULATOR
                 ========================================== -->
            <div class="calc-card calc-dark" id="calc-dark">
                <div class="display">
                    <div class="expression" id="dark-expr"></div>
                    <div class="result" id="dark-res">0</div>
                </div>
                <div class="keypad">
                    <!-- Row 1 -->
                    <button class="btn" onclick="pressDark('sc')">sc</button>
                    <button class="btn" onclick="pressDark('sin')">sin</button>
                    <button class="btn" onclick="pressDark('deg')">deg</button>
                    <button class="btn" onclick="pressDark('%')">%</button>
                    
                    <!-- Row 2 -->
                    <button class="btn num" onclick="pressDark('7')">7</button>
                    <button class="btn num" onclick="pressDark('8')">8</button>
                    <button class="btn num" onclick="pressDark('9')">9</button>
                    <button class="btn accent-blue" onclick="pressDark('/')">÷</button>
                    
                    <!-- Row 3 -->
                    <button class="btn num" onclick="pressDark('4')">4</button>
                    <button class="btn num" onclick="pressDark('5')">5</button>
                    <button class="btn num" onclick="pressDark('6')">6</button>
                    <button class="btn" onclick="pressDark('*')">×</button>
                    
                    <!-- Row 4 -->
                    <button class="btn num" onclick="pressDark('1')">1</button>
                    <button class="btn num" onclick="pressDark('2')">2</button>
                    <button class="btn num" onclick="pressDark('3')">3</button>
                    <button class="btn accent-blue" onclick="pressDark('+')">+</button>
                    
                    <!-- Row 5 -->
                    <button class="btn num" onclick="pressDark('0')">0</button>
                    <button class="btn" onclick="pressDark('.')">.</button>
                    <button class="btn" onclick="pressDark('=')">=</button>
                    <button class="btn accent-blue pill" onclick="pressDark('=')">=</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ==========================================
        // ⚙️ CUSTOMIZE BACKGROUND IMAGE HERE ⚙️
        // Paste any online image URL inside the quotes:
        const CUSTOM_BACKGROUND_URL = 'f17f48448b00ee31ba98f4340514c90c.jpg'; 
        // ==========================================

        // Apply background URL from code customization
        window.addEventListener('DOMContentLoaded', () => {
            if (CUSTOM_BACKGROUND_URL.trim() !== '') {
                document.body.style.backgroundImage = `url('${CUSTOM_BACKGROUND_URL}')`;
            }
        });

        const body = document.body;
        const toggleText = document.getElementById('toggle-text');

        // Theme Toggle Handler
        function toggleTheme() {
            const currentTheme = body.getAttribute('data-active-theme');
            if (currentTheme === 'light') {
                body.setAttribute('data-active-theme', 'dark');
                toggleText.innerHTML = 'Switch to Light Theme ☀️';
            } else {
                body.setAttribute('data-active-theme', 'light');
                toggleText.innerHTML = 'Switch to Dark Theme 🌙';
            }
        }

        // Calculator states, starting entirely from '0'
        let lightState = { expression: '', isFresh: true };
        let darkState = { expression: '', isFresh: true };

        const lightExprEl = document.getElementById('light-expr');
        const lightResEl = document.getElementById('light-res');

        const darkExprEl = document.getElementById('dark-expr');
        const darkResEl = document.getElementById('dark-res');

        // Light Calculator Logic
        function pressLight(val) {
            if (lightState.isFresh) {
                lightState.expression = '';
                lightState.isFresh = false;
            }

            if (val === 'Ac') {
                lightState.expression = '';
                lightExprEl.textContent = '';
                lightResEl.textContent = '0';
                return;
            }

            if (val === '=') {
                evaluate(lightState, lightExprEl, lightResEl);
                return;
            }

            if (val === '±') {
                if (lightState.expression) {
                    if (lightState.expression.startsWith('-')) {
                        lightState.expression = lightState.expression.substring(1);
                    } else {
                        lightState.expression = '-' + lightState.expression;
                    }
                    updateUi(lightState, lightExprEl);
                }
                return;
            }

            appendInput(lightState, val);
            updateUi(lightState, lightExprEl);
        }

        // Dark Calculator Logic
        function pressDark(val) {
            if (darkState.isFresh) {
                darkState.expression = '';
                darkState.isFresh = false;
            }

            if (val === 'sc') {
                darkState.expression = '';
                darkExprEl.textContent = '';
                darkResEl.textContent = '0';
                return;
            }

            if (val === 'sin') {
                try {
                    let currentVal = eval(darkState.expression || '0');
                    let sinVal = Math.sin(currentVal);
                    darkResEl.textContent = '=' + formatNumber(sinVal);
                    darkState.expression = sinVal.toString();
                } catch {
                    darkResEl.textContent = 'Error';
                }
                return;
            }

            if (val === '=') {
                evaluate(darkState, darkExprEl, darkResEl);
                return;
            }

            appendInput(darkState, val);
            updateUi(darkState, darkExprEl);
        }

        // Shared Logic Helpers
        function appendInput(state, val) {
            const last = state.expression.slice(-1);
            if (['+', '-', '*', '/', '%', '.'].includes(val) && ['+', '-', '*', '/', '%', '.'].includes(last)) {
                state.expression = state.expression.slice(0, -1) + val;
            } else {
                state.expression += val;
            }
        }

        function updateUi(state, exprElement) {
            let formatted = state.expression
                .replace(/\*/g, '×')
                .replace(/\//g, '÷')
                .replace(/\+/g, '+')
                .replace(/\-/g, '−');
            exprElement.textContent = formatted;
        }

        function evaluate(state, exprElement, resElement) {
            if (!state.expression) return;
            try {
                const sanitized = state.expression.replace(/[^0-9+\-*/%.()]/g, '');
                let rawRes = Function(`"use strict"; return (${sanitized})`)();
                
                if (rawRes === Infinity || isNaN(rawRes)) {
                    resElement.textContent = 'Error';
                } else {
                    resElement.textContent = '=' + formatNumber(rawRes);
                    state.expression = rawRes.toString();
                }
            } catch {
                resElement.textContent = 'Error';
            }
        }

        function formatNumber(num) {
            return Number(num.toFixed(8)).toLocaleString(undefined, {
                maximumFractionDigits: 3
            });
        }
    </script>
</body>
</html>
