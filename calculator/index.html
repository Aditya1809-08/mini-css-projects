<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calcora — Glassmorphism Calculator</title>
<style>
  :root {
    --bg-1: #05051b;
    --bg-2: #11115a;
    --bg-3: #0b7aa2;
    --glass: rgba(255, 255, 255, 0.10);
    --glass-strong: rgba(255, 255, 255, 0.16);
    --border: rgba(255, 255, 255, 0.24);
    --text: #f7f9ff;
    --muted: rgba(233, 241, 255, 0.68);
    --cyan: #57e8ff;
    --violet: #9b6cff;
    --pink: #f65cff;
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    min-height: 100dvh;
    overflow-x: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(18px, 4vw, 56px);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 12% 18%, rgba(78, 75, 255, 0.34), transparent 30%),
      radial-gradient(circle at 88% 22%, rgba(42, 220, 255, 0.28), transparent 30%),
      radial-gradient(circle at 76% 86%, rgba(245, 76, 255, 0.24), transparent 28%),
      linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 48%, var(--bg-3) 100%);
    position: relative;
    -webkit-user-select: none;
    user-select: none;
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    inset: auto;
    border-radius: 50%;
    filter: blur(26px);
    pointer-events: none;
    opacity: 0.75;
    z-index: 0;
  }

  body::before {
    width: 34vw;
    height: 34vw;
    max-width: 420px;
    max-height: 420px;
    left: -8vw;
    bottom: -10vw;
    background: radial-gradient(circle, rgba(83, 108, 255, 0.40), transparent 68%);
  }

  body::after {
    width: 30vw;
    height: 30vw;
    max-width: 380px;
    max-height: 380px;
    right: -8vw;
    top: -8vw;
    background: radial-gradient(circle, rgba(58, 245, 255, 0.34), transparent 68%);
  }

  .shell {
    width: min(100%, 980px);
    display: grid;
    justify-items: center;
    gap: clamp(18px, 3vw, 30px);
    position: relative;
    z-index: 1;
  }

  .brand {
    text-align: center;
  }

  .logo {
    width: clamp(58px, 7vw, 76px);
    height: clamp(58px, 7vw, 76px);
    margin: 0 auto 14px;
    border-radius: 24px;
    display: grid;
    place-items: center;
    color: white;
    font-size: clamp(24px, 4vw, 34px);
    font-weight: 800;
    letter-spacing: -0.08em;
    background:
      linear-gradient(145deg, rgba(255,255,255,0.24), rgba(255,255,255,0.07)),
      linear-gradient(135deg, #6674ff, #20d8ef 55%, #d24dff);
    border: 1px solid rgba(255,255,255,0.38);
    box-shadow: 0 16px 44px rgba(49, 81, 255, 0.34), inset 0 1px 0 rgba(255,255,255,0.36);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  .logo::before { content: "+"; }

  h1 {
    margin: 0;
    font-size: clamp(34px, 7vw, 66px);
    line-height: 0.95;
    letter-spacing: -0.055em;
    font-weight: 800;
    background: linear-gradient(90deg, #65efff, #bd94ff 52%, #ff7ae8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .tagline {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: clamp(14px, 2vw, 19px);
    letter-spacing: 0.015em;
  }

  .calculator {
    width: min(100%, 620px);
    padding: clamp(16px, 3vw, 24px);
    border-radius: clamp(26px, 4vw, 38px);
    background: linear-gradient(145deg, rgba(255,255,255,0.16), rgba(255,255,255,0.065));
    border: 1px solid var(--border);
    box-shadow: 0 35px 90px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.18);
    backdrop-filter: blur(30px) saturate(135%);
    -webkit-backdrop-filter: blur(30px) saturate(135%);
    position: relative;
    overflow: hidden;
  }

  .calculator::before {
    content: "";
    position: absolute;
    width: 56%;
    height: 56%;
    left: -12%;
    top: -12%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(97, 222, 255, 0.26), transparent 68%);
    pointer-events: none;
  }

  .display {
    min-height: clamp(150px, 25vw, 220px);
    padding: clamp(20px, 4vw, 32px);
    border-radius: clamp(20px, 3.5vw, 30px);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: flex-end;
    text-align: right;
    background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(70,100,220,0.08));
    border: 1px solid rgba(255,255,255,0.22);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 14px 40px rgba(0,0,0,0.16);
    position: relative;
    overflow: hidden;
  }

  .display::after {
    content: "";
    position: absolute;
    width: 65%;
    height: 160%;
    top: -70%;
    left: -18%;
    transform: rotate(28deg);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.11), transparent);
    pointer-events: none;
  }

  .expression {
    min-height: 24px;
    width: 100%;
    color: rgba(226, 235, 255, 0.62);
    font-size: clamp(14px, 2.3vw, 20px);
    font-weight: 500;
    overflow-wrap: anywhere;
  }

  .result {
    width: 100%;
    margin-top: 6px;
    font-size: clamp(46px, 9vw, 80px);
    line-height: 1.02;
    font-weight: 700;
    letter-spacing: -0.045em;
    overflow-wrap: anywhere;
  }

  .pad {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: clamp(9px, 1.5vw, 14px);
    margin-top: clamp(12px, 2vw, 18px);
  }

  button {
    min-width: 0;
    min-height: clamp(64px, 10vw, 88px);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: clamp(16px, 2.4vw, 22px);
    font-family: inherit;
    font-size: clamp(18px, 3vw, 26px);
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    background: linear-gradient(145deg, rgba(255,255,255,0.13), rgba(255,255,255,0.055));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.11), 0 8px 18px rgba(0,0,0,0.14);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: transform 0.12s ease, background 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }

  button:hover {
    transform: translateY(-2px);
    background: linear-gradient(145deg, rgba(255,255,255,0.19), rgba(255,255,255,0.075));
    border-color: rgba(255,255,255,0.27);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.13), 0 14px 26px rgba(0,0,0,0.18);
  }

  button:active,
  button.pressed {
    transform: scale(0.94);
    filter: brightness(1.16);
  }

  .fn {
    color: #e8e7ff;
    background: linear-gradient(145deg, rgba(146,112,255,0.20), rgba(255,255,255,0.07));
  }

  .op {
    color: var(--cyan);
    background: linear-gradient(145deg, rgba(63,210,255,0.18), rgba(74,84,255,0.11));
    border-color: rgba(77,225,255,0.27);
  }

  .op.active {
    color: #07101d;
    background: linear-gradient(135deg, #77f0ff, #9bb6ff);
    border-color: rgba(255,255,255,0.55);
    box-shadow: 0 0 28px rgba(80, 226, 255, 0.30), inset 0 1px 0 rgba(255,255,255,0.56);
  }

  .equals {
    grid-column: span 2;
    color: white;
    background: linear-gradient(135deg, #39dfff 0%, #5f7aff 48%, #bc48ff 100%);
    border-color: rgba(255,255,255,0.32);
    box-shadow: 0 16px 32px rgba(91, 87, 255, 0.30), inset 0 1px 0 rgba(255,255,255,0.36);
  }

  .equals:hover { filter: brightness(1.07); }
  .zero { grid-column: span 2; }

  .footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 14px;
    color: rgba(228,236,255,0.62);
    font-size: clamp(12px, 1.8vw, 14px);
    text-align: center;
  }

  .footer strong { color: rgba(255,255,255,0.9); font-weight: 600; }

  @media (min-width: 900px) {
    .shell { gap: 28px; }
    .calculator { width: min(620px, 62vw); }
  }

  @media (max-width: 560px) {
    .calculator { border-radius: 26px; }
    .display { min-height: 140px; }
    button { min-height: 62px; }
  }

  @media (max-height: 700px) and (orientation: landscape) {
    body { padding: 16px 22px; }
    .shell { grid-template-columns: minmax(220px, 0.6fr) minmax(420px, 1fr); align-items: center; gap: 24px; }
    .brand { text-align: left; }
    .logo { margin-left: 0; }
    .calculator { width: 100%; }
    .footer { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="brand">
    <div class="logo" aria-hidden="true"></div>
    <h1>Calcora</h1>
    <p class="tagline">Simple. Smart. Beautiful.</p>
  </header>

  <main class="calculator" aria-label="Glassmorphism calculator">
    <section class="display">
      <div class="expression" id="expression">&nbsp;</div>
      <div class="result" id="result">0</div>
    </section>

    <section class="pad">
      <button class="fn" data-action="clear">AC</button>
      <button class="fn" data-action="sign">+/-</button>
      <button class="fn" data-action="percent">%</button>
      <button class="op" data-op="÷">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="op" data-op="×">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="op" data-op="−">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="op" data-op="+">+</button>

      <button class="zero" data-num="0">0</button>
      <button data-action="decimal">.</button>
      <button class="equals" data-action="equals">=</button>
    </section>
  </main>

  <footer class="footer">
    <span>Calculate. Simplify. Conquer.</span>
    <span>Built with <strong>HTML, CSS &amp; JavaScript</strong></span>
  </footer>
</div>

<script>
  const resultEl = document.getElementById('result');
  const expressionEl = document.getElementById('expression');

  let current = '0';
  let previous = null;
  let operator = null;
  let overwrite = true;

  function updateDisplay() {
    resultEl.textContent = formatNumber(current);
    expressionEl.textContent = previous !== null ? `${formatNumber(previous)} ${operator}` : '\u00A0';
    document.querySelectorAll('.op').forEach(button => button.classList.toggle('active', button.dataset.op === operator));
  }

  function formatNumber(value) {
    if (value === 'Error') return value;
    const [intPart, decPart] = value.split('.');
    const withCommas = Number(intPart).toLocaleString('en-US');
    return decPart !== undefined ? `${withCommas}.${decPart}` : withCommas;
  }

  function inputNum(value) {
    if (current === 'Error') clearAll();
    if (overwrite) {
      current = value === '.' ? '0.' : value;
      overwrite = false;
      return;
    }
    if (value === '.' && current.includes('.')) return;
    current = current === '0' && value !== '.' ? value : current + value;
  }

  function compute(a, b, op) {
    a = parseFloat(a);
    b = parseFloat(b);
    switch (op) {
      case '+': return a + b;
      case '−': return a - b;
      case '×': return a * b;
      case '÷': return b === 0 ? NaN : a / b;
      default: return b;
    }
  }

  function setOperator(op) {
    if (current === 'Error') return;
    if (operator && !overwrite) {
      const result = compute(previous, current, operator);
      current = Number.isNaN(result) ? 'Error' : String(result);
    }
    previous = current;
    operator = op;
    overwrite = true;
  }

  function equals() {
    if (operator === null || previous === null || current === 'Error') return;
    const result = compute(previous, current, operator);
    current = Number.isNaN(result) ? 'Error' : String(result);
    previous = null;
    operator = null;
    overwrite = true;
  }

  function clearAll() {
    current = '0';
    previous = null;
    operator = null;
    overwrite = true;
  }

  document.querySelectorAll('[data-num]').forEach(button => {
    button.addEventListener('click', () => {
      inputNum(button.dataset.num);
      updateDisplay();
    });
  });

  document.querySelectorAll('[data-op]').forEach(button => {
    button.addEventListener('click', () => {
      setOperator(button.dataset.op);
      updateDisplay();
    });
  });

  document.querySelector('[data-action="equals"]').addEventListener('click', () => { equals(); updateDisplay(); });
  document.querySelector('[data-action="clear"]').addEventListener('click', () => { clearAll(); updateDisplay(); });
  document.querySelector('[data-action="decimal"]').addEventListener('click', () => { inputNum('.'); updateDisplay(); });
  document.querySelector('[data-action="sign"]').addEventListener('click', () => {
    if (current !== '0' && current !== 'Error') current = String(parseFloat(current) * -1);
    updateDisplay();
  });
  document.querySelector('[data-action="percent"]').addEventListener('click', () => {
    if (current !== 'Error') current = String(parseFloat(current) / 100);
    updateDisplay();
  });

  document.querySelectorAll('button').forEach(button => {
    button.addEventListener('pointerdown', () => button.classList.add('pressed'));
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(eventName => {
      button.addEventListener(eventName, () => button.classList.remove('pressed'));
    });
  });

  window.addEventListener('keydown', event => {
    if (event.key >= '0' && event.key <= '9') { inputNum(event.key); updateDisplay(); }
    else if (event.key === '.') { inputNum('.'); updateDisplay(); }
    else if (event.key === '+') { setOperator('+'); updateDisplay(); }
    else if (event.key === '-') { setOperator('−'); updateDisplay(); }
    else if (event.key === '*') { setOperator('×'); updateDisplay(); }
    else if (event.key === '/') { event.preventDefault(); setOperator('÷'); updateDisplay(); }
    else if (event.key === 'Enter' || event.key === '=') { equals(); updateDisplay(); }
    else if (event.key === 'Escape') { clearAll(); updateDisplay(); }
    else if (event.key === 'Backspace') {
      if (current !== 'Error' && !overwrite) {
        current = current.length > 1 ? current.slice(0, -1) : '0';
        if (current === '-') current = '0';
        updateDisplay();
      }
    }
  });

  updateDisplay();
</script>
</body>
</html>
