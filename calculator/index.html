<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculator — Aditya Srivastav</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* VIDEO BG */
    .video-bg {
      position: fixed; inset: 0; z-index: 0;
      object-fit: cover; width: 100%; height: 100%;
    }

    /* DARK OVERLAY */
    .overlay {
      position: fixed; inset: 0; z-index: 1;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(2px);
    }

    /* CALC WRAPPER */
    .calc-wrap {
      position: relative; z-index: 10;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }

    /* CALCULATOR */
    .calc {
      background: #f5f0e8;
      border-radius: 28px;
      width: 320px;
      box-shadow: 6px 6px 0 #2a2a2a, 0 20px 60px rgba(0,0,0,0.3);
      border: 2.5px solid #2a2a2a;
      overflow: hidden;
    }

    /* DISPLAY */
    .display {
      background: #faf7f2;
      padding: 28px 24px 20px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      border-bottom: 2px solid #2a2a2a;
    }

    .display-expr {
      font-size: 14px;
      color: #999;
      font-weight: 400;
      min-height: 20px;
      margin-bottom: 4px;
    }

    .display-main {
      font-size: 52px;
      font-weight: 800;
      color: #1a1a1a;
      line-height: 1;
      word-break: break-all;
      text-align: right;
    }

    /* KEYPAD */
    .keypad {
      background: #a8ddd0;
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    /* BUTTON */
    .btn {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      padding: 18px 8px;
      background: #f5f0e8;
      border: 2px solid #2a2a2a;
      border-radius: 14px;
      cursor: pointer;
      color: #1a1a1a;
      box-shadow: 3px 3px 0 #2a2a2a;
      transition: transform 0.08s, box-shadow 0.08s;
      user-select: none;
      line-height: 1;
    }

    .btn:hover { background: #eeeae0; }
    .btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #2a2a2a; }

    .btn-clear {
      background: #ffb3b3;
      color: #8b0000;
      border-color: #8b0000;
      box-shadow: 3px 3px 0 #8b0000;
    }
    .btn-clear:hover { background: #ffa0a0; }
    .btn-clear:active { box-shadow: 1px 1px 0 #8b0000; }

    .btn-eq {
      background: #2a2a2a;
      color: #f5f0e8;
      grid-column: span 2;
      font-size: 13px;
      letter-spacing: 0.05em;
      box-shadow: 3px 3px 0 #555;
    }
    .btn-eq:hover { background: #3a3a3a; }
    .btn-eq:active { box-shadow: 1px 1px 0 #555; transform: translate(2px,2px); }

    /* BACK LINK */
    .back-link {
      font-size: 12px; font-weight: 600;
      color: white;
      text-decoration: none;
      background: rgba(0,0,0,0.3);
      padding: 8px 16px;
      border-radius: 99px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      transition: background 0.2s;
    }
    .back-link:hover { background: rgba(0,0,0,0.5); }
  </style>
</head>
<body>

  <!-- =============================================
       REPLACE "YOUR-VIDEO.mp4" WITH YOUR FILENAME
       Upload your video to the calculator/ folder
       ============================================= -->
  <video class="video-bg" autoplay muted loop playsinline>
    <source src="Grace-led devotional ideas for people who love beauty for thoughtful sharing for peaceful hearts 🙏 - Pin-23362491813660369.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <div class="calc-wrap">

    <div class="calc">
      <div class="display">
        <div class="display-expr" id="expr"></div>
        <div class="display-main" id="display">0</div>
      </div>

      <div class="keypad">
        <button class="btn btn-clear" onclick="clearAll()">AC</button>
        <button class="btn" onclick="deleteLast()">DEL</button>
        <button class="btn" onclick="appendToDisplay('%')">%</button>
        <button class="btn" onclick="appendToDisplay('/')">÷</button>

        <button class="btn" onclick="appendToDisplay('1')">1</button>
        <button class="btn" onclick="appendToDisplay('2')">2</button>
        <button class="btn" onclick="appendToDisplay('3')">3</button>
        <button class="btn" onclick="appendToDisplay('*')">×</button>

        <button class="btn" onclick="appendToDisplay('4')">4</button>
        <button class="btn" onclick="appendToDisplay('5')">5</button>
        <button class="btn" onclick="appendToDisplay('6')">6</button>
        <button class="btn" onclick="appendToDisplay('+')">+</button>

        <button class="btn" onclick="appendToDisplay('7')">7</button>
        <button class="btn" onclick="appendToDisplay('8')">8</button>
        <button class="btn" onclick="appendToDisplay('9')">9</button>
        <button class="btn" onclick="appendToDisplay('-')">−</button>

        <button class="btn btn-eq" onclick="calculate()">RESULT</button>
        <button class="btn" onclick="appendToDisplay('0')">0</button>
        <button class="btn" onclick="appendToDisplay('.')">.</button>
      </div>
    </div>

    <a href="../" class="back-link">← Back to Projects</a>

  </div>

  <script>
    let currentInput = '';
    let expression = '';
    let justCalculated = false;

    const display = document.getElementById('display');
    const exprEl = document.getElementById('expr');

    function updateDisplay(val) { display.textContent = val || '0'; }

    function appendToDisplay(val) {
      const ops = ['+', '-', '*', '/'];
      if (justCalculated) {
        if (ops.includes(val)) {
          expression = currentInput + val;
          exprEl.textContent = expression;
          currentInput = '';
        } else {
          currentInput = val;
          expression = '';
          exprEl.textContent = '';
        }
        justCalculated = false;
        updateDisplay(currentInput || val);
        return;
      }
      if (ops.includes(val) && ops.includes(currentInput.slice(-1))) {
        currentInput = currentInput.slice(0, -1) + val;
        expression = currentInput;
        exprEl.textContent = expression;
        updateDisplay(val);
        return;
      }
      if (val === '.') {
        const parts = currentInput.split(/[\+\-\*\/]/);
        if (parts[parts.length - 1].includes('.')) return;
      }
      currentInput += val;
      if (ops.includes(val)) {
        expression = currentInput;
        exprEl.textContent = expression;
        updateDisplay(val);
      } else {
        const parts = currentInput.split(/(?<=[\+\-\*\/])/);
        updateDisplay(parts[parts.length - 1] || '0');
        exprEl.textContent = expression;
      }
    }

    function clearAll() {
      currentInput = ''; expression = ''; justCalculated = false;
      updateDisplay('0'); exprEl.textContent = '';
    }

    function deleteLast() {
      if (justCalculated) { clearAll(); return; }
      currentInput = currentInput.slice(0, -1);
      const parts = currentInput.split(/(?<=[\+\-\*\/])/);
      updateDisplay(parts[parts.length - 1] || '0');
    }

    function calculate() {
      if (!currentInput) return;
      try {
        expression = currentInput + ' =';
        exprEl.textContent = expression;
        let result = Function('"use strict"; return (' + currentInput.replace(/%/g, '/100') + ')')();
        result = parseFloat(result.toFixed(10));
        if (isNaN(result) || !isFinite(result)) {
          updateDisplay('ERROR'); currentInput = '';
        } else {
          updateDisplay(result); currentInput = String(result);
        }
        justCalculated = true;
      } catch {
        updateDisplay('ERROR'); currentInput = '';
        exprEl.textContent = 'SYNTAX ERROR'; justCalculated = true;
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') appendToDisplay(e.key);
      else if (e.key === '+') appendToDisplay('+');
      else if (e.key === '-') appendToDisplay('-');
      else if (e.key === '*') appendToDisplay('*');
      else if (e.key === '/') { e.preventDefault(); appendToDisplay('/'); }
      else if (e.key === '%') appendToDisplay('%');
      else if (e.key === '.') appendToDisplay('.');
      else if (e.key === 'Enter' || e.key === '=') calculate();
      else if (e.key === 'Backspace') deleteLast();
      else if (e.key === 'Escape') clearAll();
    });
  </script>

</body>
</html>
