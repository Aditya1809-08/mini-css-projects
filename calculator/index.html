<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calcora — Glassmorphism Calculator</title>

  <style>
    :root {
      --bg-1: #05051b;
      --bg-2: #11115a;
      --bg-3: #0b7aa2;
      --glass: rgba(255, 255, 255, .1);
      --border: rgba(255, 255, 255, .24);
      --text: #f7f9ff;
      --muted: rgba(233, 241, 255, .68);
      --cyan: #57e8ff;
      --violet: #9b6cff;
      --pink: #f65cff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      overflow-x: hidden;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: clamp(10px, 2vw, 20px);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 15%, rgba(78, 75, 255, .34), transparent 30%),
        radial-gradient(circle at 90% 20%, rgba(42, 220, 255, .28), transparent 30%),
        radial-gradient(circle at 78% 88%, rgba(245, 76, 255, .24), transparent 28%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2) 48%, var(--bg-3));
      -webkit-user-select: none;
      user-select: none;
      position: relative;
    }

    body:before,
    body:after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(26px);
      pointer-events: none;
      opacity: .75;
      z-index: 0;
    }

    body:before {
      width: 34vw;
      height: 34vw;
      max-width: 420px;
      max-height: 420px;
      left: -8vw;
      bottom: -10vw;
      background: radial-gradient(circle, rgba(83, 108, 255, .4), transparent 68%);
    }

    body:after {
      width: 30vw;
      height: 30vw;
      max-width: 380px;
      max-height: 380px;
      right: -8vw;
      top: -8vw;
      background: radial-gradient(circle, rgba(58, 245, 255, .34), transparent 68%);
    }

    .shell {
      width: min(100%, 980px);
      display: grid;
      justify-items: center;
      gap: clamp(10px, 1.8vw, 18px);
      position: relative;
      z-index: 1;
    }

    .brand {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: left;
      padding: 4px 4px 0;
    }

    .logo {
      width: clamp(36px, 4.5vw, 48px);
      height: clamp(36px, 4.5vw, 48px);
      flex: 0 0 auto;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: clamp(18px, 2.5vw, 24px);
      font-weight: 800;
      letter-spacing: -.08em;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, .24), rgba(255, 255, 255, .07)),
        linear-gradient(135deg, #6674ff, #20d8ef 55%, #d24dff);
      border: 1px solid rgba(255, 255, 255, .38);
      box-shadow: 0 10px 24px rgba(49, 81, 255, .28), inset 0 1px 0 rgba(255, 255, 255, .36);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .logo:before {
      content: "+";
    }

    .brand-copy {
      display: flex;
      align-items: baseline;
      gap: 9px;
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(23px, 4vw, 34px);
      line-height: 1;
      letter-spacing: -.055em;
      font-weight: 800;
      background: linear-gradient(90deg, #65efff, #bd94ff 52%, #ff7ae8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      margin: 0;
      color: var(--muted);
      font-size: clamp(11px, 1.6vw, 14px);
      white-space: nowrap;
    }

    .calculator {
      width: min(100%, 620px);
      padding: clamp(12px, 2vw, 18px);
      border-radius: clamp(22px, 3vw, 30px);
      background: linear-gradient(145deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .065));
      border: 1px solid var(--border);
      box-shadow: 0 28px 70px rgba(0, 0, 0, .42), inset 0 1px 0 rgba(255, 255, 255, .18);
      backdrop-filter: blur(30px) saturate(135%);
      -webkit-backdrop-filter: blur(30px) saturate(135%);
      position: relative;
      overflow: hidden;
    }

    .calculator:before {
      content: "";
      position: absolute;
      width: 56%;
      height: 56%;
      left: -12%;
      top: -12%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(97, 222, 255, .26), transparent 68%);
      pointer-events: none;
    }

    .display {
      min-height: clamp(120px, 18vw, 170px);
      padding: clamp(16px, 3vw, 24px);
      border-radius: clamp(18px, 2.6vw, 24px);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      text-align: right;
      background: linear-gradient(145deg, rgba(255, 255, 255, .12), rgba(70, 100, 220, .08));
      border: 1px solid rgba(255, 255, 255, .22);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), 0 14px 40px rgba(0, 0, 0, .16);
      position: relative;
      overflow: hidden;
    }

    .display:after {
      content: "";
      position: absolute;
      width: 65%;
      height: 160%;
      top: -70%;
      left: -18%;
      transform: rotate(28deg);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .11), transparent);
      pointer-events: none;
    }

    .expression {
      min-height: 22px;
      width: 100%;
      color: rgba(226, 235, 255, .62);
      font-size: clamp(13px, 2vw, 17px);
      font-weight: 500;
      overflow-wrap: anywhere;
    }

    .result {
      width: 100%;
      margin-top: 5px;
      font-size: clamp(40px, 7vw, 64px);
      line-height: 1.02;
      font-weight: 700;
      letter-spacing: -.045em;
      overflow-wrap: anywhere;
    }

    .pad {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(7px, 1.2vw, 11px);
      margin-top: clamp(10px, 1.6vw, 14px);
    }

    button {
      min-width: 0;
      min-height: clamp(56px, 7vw, 70px);
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: clamp(14px, 2vw, 18px);
      font-family: inherit;
      font-size: clamp(17px, 2.5vw, 23px);
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      background: linear-gradient(145deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, .055));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .11), 0 8px 18px rgba(0, 0, 0, .14);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: transform .12s ease, background .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: linear-gradient(145deg, rgba(255, 255, 255, .19), rgba(255, 255, 255, .075));
      border-color: rgba(255, 255, 255, .27);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .13), 0 14px 26px rgba(0, 0, 0, .18);
    }

    button:active,
    button.pressed {
      transform: scale(.94);
      filter: brightness(1.16);
    }

    .fn {
      color: #e8e7ff;
      background: linear-gradient(145deg, rgba(146, 112, 255, .2), rgba(255, 255, 255, .07));
    }

    .op {
      color: var(--cyan);
      background: linear-gradient(145deg, rgba(63, 210, 255, .18), rgba(74, 84, 255, .11));
      border-color: rgba(77, 225, 255, .27);
    }

    .op.active {
      color: #07101d;
      background: linear-gradient(135deg, #77f0ff, #9bb6ff);
      border-color: rgba(255, 255, 255, .55);
      box-shadow: 0 0 28px rgba(80, 226, 255, .3), inset 0 1px 0 rgba(255, 255, 255, .56);
    }

    .equals {
      grid-column: span 2;
      color: #fff;
      background: linear-gradient(135deg, #39dfff, #5f7aff 48%, #bc48ff);
      border-color: rgba(255, 255, 255, .32);
      box-shadow: 0 16px 32px rgba(91, 87, 255, .3), inset 0 1px 0 rgba(255, 255, 255, .36);
    }

    .equals:hover {
      filter: brightness(1.07);
    }

    .zero {
      grid-column: span 2;
    }

    .footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px 12px;
      color: rgba(228, 236, 255, .52);
      font-size: clamp(10px, 1.3vw, 12px);
      text-align: center;
    }

    .footer strong {
      color: rgba(255, 255, 255, .82);
      font-weight: 600;
    }

    @media (max-width: 560px) {
      .brand {
        justify-content: flex-start;
        padding-left: 4px;
      }

      .brand-copy {
        gap: 7px;
      }

      .tagline {
        white-space: normal;
      }

      .calculator {
        border-radius: 22px;
      }

      .display {
        min-height: 120px;
      }

      button {
        min-height: 56px;
      }
    }

    @media (max-width: 380px) {
      .brand {
        gap: 8px;
      }

      .logo {
        width: 34px;
        height: 34px;
        border-radius: 12px;
      }

      .brand h1 {
        font-size: 22px;
      }

      .tagline {
        display: none;
      }

      .calculator {
        padding: 10px;
      }

      .pad {
        gap: 6px;
      }

      button {
        min-height: 52px;
        border-radius: 13px;
      }
    }

    @media (max-height: 650px) and (orientation: landscape) {
      body {
        padding: 8px 16px;
      }

      .shell {
        grid-template-columns: minmax(190px, .45fr) minmax(420px, 1fr);
        align-items: center;
        gap: 16px;
      }

      .brand {
        justify-content: flex-start;
      }

      .calculator {
        width: 100%;
      }

      .footer {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>

<body>
  <div class="shell">
    <header class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div class="brand-copy">
        <h1>Calcora</h1>
        <p class="tagline">Simple. Smart. Beautiful.</p>
      </div>
    </header>

    <main class="calculator" aria-label="Glassmorphism calculator">
      <section class="display">
        <div class="expression" id="expression">&nbsp;</div>
        <div class="result" id="result">0</div>
      </section>

      <section class="pad">
        <button class="fn" data-action="clear">AC</button>
        <button class="fn" data-action="sign">+/-</button>
        <button class="fn" data-action="percent">%</button>
        <button class="op" data-op="÷">÷</button>

        <button data-num="7">7</button>
        <button data-num="8">8</button>
        <button data-num="9">9</button>
        <button class="op" data-op="×">×</button>

        <button data-num="4">4</button>
        <button data-num="5">5</button>
        <button data-num="6">6</button>
        <button class="op" data-op="−">−</button>

        <button data-num="1">1</button>
        <button data-num="2">2</button>
        <button data-num="3">3</button>
        <button class="op" data-op="+">+</button>

        <button class="zero" data-num="0">0</button>
        <button data-action="decimal">.</button>
        <button class="equals" data-action="equals">=</button>
      </section>
    </main>

    <footer class="footer">
      <span><strong>Calcora</strong> · Glassmorphism Calculator</span>
      <span>Built with HTML · CSS · JavaScript</span>
    </footer>
  </div>

  <script>
    const resultEl = document.getElementById('result');
    const expressionEl = document.getElementById('expression');
    const buttons = [...document.querySelectorAll('button')];

    let current = '0';
    let stored = null;
    let operator = null;
    let waiting = false;

    const symbols = { '÷': '/', '×': '*', '−': '-' };

    function render() {
      resultEl.textContent = current;
      expressionEl.textContent = stored !== null && operator ? `${stored} ${operator}` : '\u00a0';
    }

    function formatNumber(value) {
      if (!Number.isFinite(value)) return 'Error';
      return String(parseFloat(value.toFixed(10)));
    }

    function inputNumber(num) {
      if (current === 'Error') current = '0';
      if (waiting) {
        current = num;
        waiting = false;
      } else {
        current = current === '0' ? num : current + num;
      }
      render();
    }

    function inputDecimal() {
      if (waiting) {
        current = '0.';
        waiting = false;
      } else if (!current.includes('.')) {
        current += '.';
      }
      render();
    }

    function clearAll() {
      current = '0';
      stored = null;
      operator = null;
      waiting = false;
      render();
    }

    function toggleSign() {
      if (current === '0' || current === 'Error') return;
      current = current.startsWith('-') ? current.slice(1) : `-${current}`;
      render();
    }

    function percent() {
      if (current === 'Error') return;
      current = formatNumber(Number(current) / 100);
      render();
    }

    function calculate() {
      if (stored === null || operator === null) return;
      const a = Number(stored);
      const b = Number(current);
      let value;

      switch (symbols[operator]) {
        case '+': value = a + b; break;
        case '-': value = a - b; break;
        case '*': value = a * b; break;
        case '/': value = b === 0 ? NaN : a / b; break;
        default: value = b;
      }

      current = formatNumber(value);
      stored = null;
      operator = null;
      waiting = true;
      render();
    }

    function chooseOperator(nextOperator) {
      if (current === 'Error') return;
      if (operator && waiting) {
        operator = nextOperator;
        render();
        return;
      }
      if (stored !== null) calculate();
      stored = current;
      operator = nextOperator;
      waiting = true;
      render();
    }

    buttons.forEach((button) => {
      button.addEventListener('click', () => {
        button.classList.add('pressed');
        setTimeout(() => button.classList.remove('pressed'), 110);

        if (button.dataset.num) inputNumber(button.dataset.num);
        else if (button.dataset.op) chooseOperator(button.dataset.op);
        else {
          const action = button.dataset.action;
          if (action === 'decimal') inputDecimal();
          if (action === 'clear') clearAll();
          if (action === 'sign') toggleSign();
          if (action === 'percent') percent();
          if (action === 'equals') calculate();
        }
      });
    });

    window.addEventListener('keydown', (event) => {
      const key = event.key;
      if (/\d/.test(key)) inputNumber(key);
      else if (key === '.') inputDecimal();
      else if (['+', '-', '*', '/'].includes(key)) {
        const op = Object.entries(symbols).find(([, value]) => value === key)?.[0];
        if (op) chooseOperator(op);
      } else if (key === 'Enter' || key === '=') calculate();
      else if (key === 'Escape') clearAll();
      else if (key === '%') percent();
      else if (key === 'Backspace') {
        current = current.length > 1 ? current.slice(0, -1) : '0';
        render();
      }
    });

    render();
  </script>
</body>
</html>
