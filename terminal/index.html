<!DOCTYPE html> bbjk
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Terminal — Aditya Srivastav</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Fira Code', monospace;
      background: url('../69ca072219a69bcf0ad1c006f52c28ae.jpg') center/cover no-repeat fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* TERMINAL WINDOW */
    .terminal {
      width: 100%;
      max-width: 680px;
      background: #1a1a1a;
      border-radius: 12px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05);
      overflow: hidden;
    }

    /* TITLE BAR */
    .titlebar {
      background: #2a2a2a;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .dot {
      width: 13px; height: 13px;
      border-radius: 50%;
    }

    .dot-red   { background: #ff5f57; }
    .dot-yellow{ background: #febc2e; }
    .dot-green { background: #28c840; }

    .titlebar-text {
      flex: 1;
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      margin-left: -45px;
    }

    /* TERMINAL BODY */
    .terminal-body {
      padding: 24px;
      min-height: 380px;
      max-height: 500px;
      overflow-y: auto;
    }

    .terminal-body::-webkit-scrollbar { width: 4px; }
    .terminal-body::-webkit-scrollbar-track { background: transparent; }
    .terminal-body::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    /* LINES */
    .line {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.6;
      opacity: 0;
      animation: fadeIn 0.1s ease forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .prompt {
      color: #28c840;
      white-space: nowrap;
      user-select: none;
    }

    .prompt-path { color: #58a6ff; }
    .prompt-symbol { color: #a78bfa; }

    .text { color: #e2e8f0; flex: 1; }
    .text.command { color: #fbbf24; }
    .text.output  { color: #94a3b8; }
    .text.success { color: #28c840; }
    .text.error   { color: #ff5f57; }
    .text.info    { color: #58a6ff; }
    .text.highlight { color: #f97316; }

    /* CURSOR */
    .cursor {
      display: inline-block;
      width: 9px;
      height: 16px;
      background: #28c840;
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* INPUT LINE */
    .input-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .input-line input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'Fira Code', monospace;
      font-size: 14px;
      color: #fbbf24;
      caret-color: #28c840;
    }

    .input-line input::placeholder { color: rgba(255,255,255,0.2); }

    /* RESTART BTN */
    .restart-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 4px 10px;
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      transition: background 0.2s;
    }

    .restart-btn:hover {
      background: rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.7);
    }

    .titlebar { position: relative; }
  </style>
</head>
<body>

  <div class="terminal">
    <div class="titlebar">
      <div class="dot dot-red"></div>
      <div class="dot dot-yellow"></div>
      <div class="dot dot-green"></div>
      <div class="titlebar-text">aditya@portfolio ~ bash</div>
      <button class="restart-btn" onclick="restart()">↺ restart</button>
    </div>

    <div class="terminal-body" id="body"></div>
  </div>

  <script>
    const lines = [
      { delay: 300,  prompt: true,  text: "whoami",             cls: "command" },
      { delay: 800,  prompt: false, text: "→ Aditya Srivastav", cls: "success" },
      { delay: 1400, prompt: true,  text: "cat about.txt",      cls: "command" },
      { delay: 1900, prompt: false, text: "12th grader from Gorakhpur, UP 🇮🇳", cls: "output" },
      { delay: 2100, prompt: false, text: "Exploring tech & web development 🚀", cls: "output" },
      { delay: 2300, prompt: false, text: "Learning HTML, CSS — one commit at a time ✨", cls: "output" },
      { delay: 2900, prompt: true,  text: "ls projects/",       cls: "command" },
      { delay: 3400, prompt: false, text: "📁 Hello-World       📁 Portfolio        📁 mini-css-projects", cls: "info" },
      { delay: 4000, prompt: true,  text: "cat skills.json",    cls: "command" },
      { delay: 4500, prompt: false, text: '{ "languages": ["HTML", "CSS"],',  cls: "output" },
      { delay: 4700, prompt: false, text: '  "tools": ["GitHub", "VS Code"],', cls: "output" },
      { delay: 4900, prompt: false, text: '  "learning": ["JavaScript", "Python"] }', cls: "output" },
      { delay: 5500, prompt: true,  text: "open github.com/Aditya1809-08", cls: "command" },
      { delay: 6000, prompt: false, text: "✅ Opening GitHub profile...", cls: "success" },
      { delay: 6600, prompt: true,  text: "echo $goal",         cls: "command" },
      { delay: 7100, prompt: false, text: "→ B.Tech AI/ML @ Chandigarh University 🎯", cls: "highlight" },
      { delay: 7700, prompt: true,  text: "",                   cls: "command", cursor: true },
    ];

    let timeouts = [];

    function buildLine(line) {
      const body = document.getElementById('body');
      const div = document.createElement('div');
      div.className = 'line';

      if (line.prompt) {
        div.innerHTML = `
          <span class="prompt">
            <span class="prompt-path">~/aditya</span>
            <span class="prompt-symbol"> ❯ </span>
          </span>
          <span class="text ${line.cls}">${line.text}${line.cursor ? '<span class="cursor"></span>' : ''}</span>`;
      } else {
        div.innerHTML = `<span class="text ${line.cls}" style="padding-left:80px;">${line.text}</span>`;
      }

      body.appendChild(div);
      body.scrollTop = body.scrollHeight;
    }

    function start() {
      const body = document.getElementById('body');
      body.innerHTML = '';
      timeouts.forEach(clearTimeout);
      timeouts = [];

      // Welcome line
      const welcome = document.createElement('div');
      welcome.className = 'line';
      welcome.style.opacity = '1';
      welcome.innerHTML = `<span class="text info">Welcome to Aditya's Terminal Portfolio v1.0 🖥️</span>`;
      body.appendChild(welcome);

      const sep = document.createElement('div');
      sep.className = 'line';
      sep.style.opacity = '1';
      sep.innerHTML = `<span class="text output">─────────────────────────────────────────</span>`;
      body.appendChild(sep);

      lines.forEach(line => {
        const t = setTimeout(() => buildLine(line), line.delay);
        timeouts.push(t);
      });
    }

    function restart() { start(); }

    start();
  </script>

</body>
</html>
