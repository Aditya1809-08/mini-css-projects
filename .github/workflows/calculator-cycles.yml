name: Calculator Change-Restore Cycles

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"   # 12:00 PM IST
    - cron: "30 9 * * *"   # 3:00 PM IST
    - cron: "30 12 * * *"  # 6:00 PM IST

permissions:
  contents: write

concurrency:
  group: calculator-change-restore-main
  cancel-in-progress: false

jobs:
  cycles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "Aditya srivastav"
          git config user.email "aditya.123.22.111@gmail.com"

      - name: Run 4 sequential change-restore cycles
        shell: bash
        run: |
          set -euo pipefail

          FILE="calculator/index.html"
          MAX_RETRIES=3

          for i in 1 2 3 4; do
            echo "===== Cycle $i ====="
            attempt=1

            while true; do
              if [ "$attempt" -gt "$MAX_RETRIES" ]; then
                echo "Cycle $i failed after $MAX_RETRIES attempts. Stopping safely."
                exit 1
              fi

              echo "Attempt $attempt/$MAX_RETRIES"

              git fetch origin main
              git checkout -B main origin/main

              # Save the exact current file contents and blob hash.
              cp "$FILE" /tmp/calculator-original
              ORIGINAL_BLOB="$(git hash-object "$FILE")"

              # Make exactly one-line temporary content.
              RANDOM_LINE="cycle_${i}_temp_${RANDOM}_$(date +%s%N)"
              printf '%s' "$RANDOM_LINE" > "$FILE"

              git add "$FILE"
              git commit -m "test: temporary calculator change $i"
              TEMP_SHA="$(git rev-parse HEAD)"

              # Push without force. If main moved, retry from latest main.
              if git push origin HEAD:main; then
                echo "Temporary commit pushed: $TEMP_SHA"
              else
                echo "Temporary push failed; retrying from latest main."
                git fetch origin main
                attempt=$((attempt + 1))
                continue
              fi

              # Restore the exact bytes saved before the temporary change.
              cp /tmp/calculator-original "$FILE"
              RESTORE_BLOB="$(git hash-object "$FILE")"

              if [ "$RESTORE_BLOB" != "$ORIGINAL_BLOB" ]; then
                echo "ERROR: restoration bytes differ from original."
                exit 1
              fi

              git add "$FILE"
              git commit -m "test: restore calculator change $i"
              RESTORE_SHA="$(git rev-parse HEAD)"

              if git push origin HEAD:main; then
                echo "Restoration commit pushed: $RESTORE_SHA"
              else
                echo "Restoration push failed. Re-fetching latest main."
                git fetch origin main
                attempt=$((attempt + 1))
                continue
              fi

              # Verify remote main and exact file contents.
              git fetch origin main
              git checkout -B main origin/main
              FINAL_BLOB="$(git hash-object "$FILE")"

              if [ "$FINAL_BLOB" != "$ORIGINAL_BLOB" ]; then
                echo "ERROR: remote restoration verification failed."
                exit 1
              fi

              echo "Cycle $i verified."
              echo "Temporary SHA:  $TEMP_SHA"
              echo "Restore SHA:    $RESTORE_SHA"
              break
            done
          done

          echo "===== Final verification ====="
          git fetch origin main
          git checkout -B main origin/main
          git status --short
          echo "calculator/index.html blob: $(git hash-object "$FILE")"
          echo "All 4 cycles completed and the file is restored."
